# =============================================================================
# Dependabot: security updates only
# =============================================================================
# Version-update PRs are off (limit 0) for both ecosystems. The weekly
# dependency report issue (.github/workflows/outdated-report.yml) lists every
# other npm and GitHub Actions update, to be picked up by hand in one batch PR.
#
# Security updates are a repository setting and don't depend on this file:
# GitHub opens them for every ecosystem it detects, and the limit doesn't apply
# to them. The entries stay so the policy is written down where someone would
# turn version updates back on.
# =============================================================================
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # Lockstep sets: packages that must move together. A group with only
    # `patterns` is one set; its members are never bumped on their own, the
    # set moves as a whole.
    groups:
      # eslint-config-next is released with next under the same version.
      next:
        patterns:
          - next
          - eslint-config-next
      # react-dom peer-requires the exact react; the types follow them.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # fumadocs-ui depends on the exact fumadocs-core version.
      fumadocs:
        patterns:
          - fumadocs-core
          - fumadocs-ui
          - "@fumadocs/*"
      # Pre-1.0: a core minor can break the next and mdx adapters.
      content-collections:
        patterns:
          - "@content-collections/*"
    # Held majors. These are notes, not `ignore` entries, because an ignore
    # also blocks security updates:
    # - @types/node tracks the Node major in the Dockerfile (node:20-alpine);
    #   move both in the same PR.
    # - eslint stays on 8 until .eslintrc.json is migrated to flat config.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
