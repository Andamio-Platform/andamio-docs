name: StudentCommitToAssignmentTransaction
id: student-commit-to-assignment

# Metadata about this transaction type
metadata:
  role: "Student"
  category: "assignment_management"
  requires_tokens: ["100at", "222at"]
  estimated_fee: "2.5 ADA"
  description: "Student commits to working on a specific module assignment"

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: ["1 index.222bob"]
  
  - id: course_state_1
    type: script
    redeemer:
      alias: "bob"
      string: "101"
      maybe_string: "Just some"
    output:
      address: "course_state"
      value: ["1 course_state.bob"]
      datum: 
        assignment_list: ["201", "202", "203"]

reference_inputs:
- id:
  type: script
  output:
    address: "module"
    value: ["1 module.101"]
    datum:
      slts: ["(slt, content)"]
      maybe_assignment:
      string: "assignment data hash"
      address: "assignment"
      policy_id: ["course_state"]
      assignment_list: ["201", "202"]

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: ["1 index.222bob"]

  - id: assignment_1
    type: script
    output:
      address: "assignment"
      value: ["1 course_state.bob"]
      datum:
        string: "101"
        maybe_string: "Just some"
        policy_id: "course_state"
        alias: "bob"
        address: "course_state"
        assignment_list: ["201", "202", "203"]