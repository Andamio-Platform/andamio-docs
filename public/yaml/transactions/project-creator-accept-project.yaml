name: ProjectCreatorAcceptProjectTransaction
id: project-creator-accept-project

# Metadata about this transaction type
metadata:
  role: "ProjectCreator"
  category: "project_management"
  requires_tokens: ["100at", "projectCreatorNFT"]
  estimated_fee: "3.0 ADA"
  description: "Project creator accepts a contributor's project proposal or application"
  multi_signature: false

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "alice"
      value: ["1 index.222alice"]

  - id: instance_governance_1
    type: script
    redeemer: "alice"
    output:
      address: "instance.instance-governance-scripts"
      value: ["1 nft.ProjectNFT"]
      datum:
        creators: ["alice"]
        policy_id: "nft"

  - id: escrow_1
    type: script
    redeemer: 
      alias: "bob"
    output:
      address: "project.escrow1"
      value: ["1 contributor_state.bob",
              "12000000 lovelace"]
      datum:
        project_data:
          project_data: "content hash"
          deadline: 16062025
          lovelace_am: 10000000
          flatten_value: []
        script_hash: "treasury"
        policy_id: "contributor_state"
        maybe_string: "Just some"

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "alice"
      value: ["1 index.222alice"]

  - id: instance_governance_1
    type: script
    output:
      address: "instance.instance-governance-scripts"
      value: ["1 nft.ProjectNFT"]
      datum:
        creators: ["alice"]
        policy_id: "nft"

  - id: contributor_state_1
    type: script
    output:
      address: "project.contributor-state-scripts"
      value: ["1 contributor_state.bob",
              "12000000 lovelace"]
      datum:
        string: "project hash 1"