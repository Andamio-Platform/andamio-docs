name: ContributorMintProjectStateTransaction
id: contributor-mint-project-state

# Metadata about this transaction type
metadata:
  role: "Contributor"
  category: "state_management"
  requires_tokens: ["100at", "contributorNFT"]
  estimated_fee: "2.5 ADA"
  description: "Contributor mints project state token to track participation"
  multi_signature: false

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: ["1 index.222bob"]

  - id: global_state_1
    type: script
    redeemer: 
      nft: "policy_id"
      project_list: ["project hash 1", "project hash 2", "project hash 3"]
      contributor_state: "policy_id"
    output:
      address: "global_state"
      value: ["1 index.100bob"]
      datum:
        policy_id: "global_state"
        alias: "bob"
        local_state_information:
          - nft: "policy_id"
            project_list: ["project hash 1", "project hash 2", "project hash 3"]
            bool: false

          - contributor_state: "policy_id"
            project_list: ["project hash 1"]
            bool: false
        info: "()"

# reference inputs
reference-inputs:
  - id: instance_1
    type: script
    output:
      address: "instance"
      value: ["1 instance_provider.ContributorStateScripts"]
      datum: "nft"
      script: "contributor_state"

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: ["1 index.222bob"]

  - id: global_state_1
    type: script
    output:
      address: "global_state"
      value: ["1 index.100bob"]
      datum:
        policy_id: "global_state"
        alias: "bob"
        local_state_information:
          - nft: "policy_id"
            project_list: []
            bool: true

          - contributor_state: "policy_id"
            project_list: ["project hash 1"]
            bool: false
        info: "()"

  - id: contributor_state_1
    type: script
    output:
      address: "contributor_state"
      value: ["2 contributor_state.bob"]
      datum: 
        project_list: ["project hash 1", "project hash 2", "project hash 3"]

mints:
  - id: contributor_state
    redeemer:
      string: "bob"
      prerequisits: ["(other_nft, [project hash 1])"]
    tokens: ["2 contributor_state.bob"]