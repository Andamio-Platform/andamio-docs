name: CourseCreatorMintModuleTokensTransaction
id: course-creator-mint-module-tokens

# Metadata about this transaction type
metadata:
  role: "CourseCreator"
  category: "course_management"
  requires_tokens: ["100at", "courseCreatorNFT"]
  estimated_fee: "3.5 ADA"
  description: "Course creator mints module tokens for course content"
  multi_signature: false

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "alice"
      value: ["1 index.222alice"]

  - id: instance_governance_1
    type: script
    redeemer: "alice"
    output:
      address: "instance governance"
      value: ["1 nft.CourseNFT"]
      datum:
        creators: ["alice"]
        policy_id: "nft"

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "alice"
      value: ["1 index.222alice"]

  - id: instance_governance_1
    type: script
    output:
      address: "instance governance"
      value: ["1 nft.CourseNFT"]
      datum:
        creators: ["alice"]
        policy_id: "nft"
  
  - id:
    type: script
    output:
      address: "module"
      value: ["1 module.103"]
      datum:
        slts: ["(slt, content)"]
        maybe_assignment:
          string: "assignment data hash"
          address: "assignment"
          policy_id: ["course_state"]
          required: ["101", "102"]

mints:
  - id: course-state-scripts
    redeemer:
      - string: "103"
        slts: ["(slt, content)"]
        maybe_assignment:
          string: "assignment data hash"
          address: "assignment"
          policy_id: ["course_state"]
          required: ["101", "102"]

    tokens: ["1 module.103"]