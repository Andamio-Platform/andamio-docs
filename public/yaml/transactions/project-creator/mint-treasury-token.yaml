# Token references use dot notation to map to validator-registry-v1.yaml
# Format: <system>.<token-name> maps to registry path: systems > <system> > tokens > <token-name>

name: ProjectCreatorMintTreasuryTokenTransaction
id: project-creator.mint-treasury-token

# Metadata about this transaction type
metadata:
  role: "project-creator"
  category: "treasury_management"
  requires_tokens: ["global-state.access-token-user", "project.project-nft"]
  estimated_cost: "3.5 ADA"
  description: "Project creator mints treasury token to initialize project treasury"
  multi_signature: false

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "project creator"
      value: 
        - "1 global-state.access-token-user"
  - id: instance_governance_1
    type: script
    redeemer: ["<alias_project_creator>"]
    output:
      address: "instance.instance-governance-scripts"
      value: 
        - "1 project.project-nft"
      datum:
        creators: ["<alias_project_creator>"]
        policy_id: "<project_nft_policyid>"

reference_inputs:
  - id: instance_1
    type: script
    output:
      address: "instance.instance-scripts"
      value: 
        - "1 project.project-instance-escrow1"
      datum: "<nft_datum>"
      script: "<escrow_script>"

  - id: instance_1
    type: script
    output:
      address: "instance.instance-scripts"
      value: 
        - "1 project.project-instance-treasury-scripts"
      datum: "<nft_datum>"
      script: "<treasury_script>"
# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "project creator"
      value: 
        - "1 global-state.access-token-user"
  - id: instance_governance_1
    type: script
    output:
      address: "instance.instance-governance-scripts"
      value: 
        - "1 project.project-nft"
      datum:
        creators: ["<alias_project_creator>"]
        policy_id: "<project_nft_policyid>"

  - id: treasury_1
    type: script
    output:
      address: "project.treasury-scripts"
      value: 
        - "1 project.treasury-token"
      datum:
        projects: ["(<project_hash_1>, <int_1>)", "(<project_hash_2>, <int_2>)"]
        policy_id: ["<contributor_state_policyid>", "<contributor_state_policyid_3>"]

mints:
  - id: treasury_token
    policy: "project.treasury-token"
    redeemer:
      treasury: "<treasury_script_hash>"
      escrow: "<escrow_script_hash>"
      policy_id: ["contributor_state", "contributor_state3"]
      projects:
        - project_data:
            project_data: "<content_hash_1>"
            deadline: <deadline_1>
            lovelace_am: <lovelace_amount_1>
            flatten_value:
          int: <int_1>
        - project_data:
            project_data: "<content_hash_2>"
            deadline: <deadline_2>
            lovelace_am: <lovelace_amount_2>
            flatten_value:
          int: <int_2>
    tokens:
      - "1 project.treasury-token"