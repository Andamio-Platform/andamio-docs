# Token references use dot notation to map to validator-registry-v1.yaml
# Format: <system>.<token-name> maps to registry path: systems > <system> > tokens > <token-name>

name: ProjectCreatorManageTreasuryTransaction
id: project-creator.manage-treasury-token

# Metadata about this transaction type
metadata:
  role: "project-creator"
  category: "treasury_management"
  requires_tokens: ["global-state.access-token-user", "project.project-nft", "project.treasury-token"]
  estimated_cost: "4.5 ADA"
  description: "Project creator manages treasury funds and distribution"
  multi_signature: true
  required_signatures: ["projectCreator", "instanceAdmin"]

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "project creator"
      value: 
        - "1 global-state.access-token-user"
  - id: instance_governance_1
    type: script
    redeemer: ["<alias_project_creator>"]
    output:
      address: "instance.instance-governance-scripts"
      value: 
        - "1 project.project-nft"
      datum:
        creators: ["<alias_project_creator>"]
        policy_id: "<project_nft_policyid>"

  - id: treasury_1
    type: script
    redeemer:
      - projects:
        project_data:
          project_data: "<content_hash_1>"
          deadline: <deadline_1>
          lovelace_am: <lovelace_amount_1>
          flatten_value:
        int: <int_1>
      - projects:
        project_data:
          project_data: "<content_hash_2>"
          deadline: <deadline_2>
          lovelace_am: <lovelace_amount_2>
          flatten_value:
        int: <int_2>
      - policy_id: ["<contributor_state_policyid_new>", "<contributor_state_policyid_new3>"]
      - script_hash: "<escrow_hash>"
    output:
      address: "project.treasury-scripts"
      value: 
        - "1 project.treasury-token"
      datum:
        projects: ["(<project_hash_1>, <int_1>)", "(<project_hash_2>, <int_2>)", "(<project_hash_3>, <int_3>)"]
        policy_id: ["<contributor_state_policyid>", "<contributor_state_policyid_3>"]

  - id: treasury_2
    type: script
    redeemer: "<commit_fund_action>"
    output:
      address: "project.treasury-scripts"
      value: 
        - "15000000 lovelace"

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "project creator"
      value: 
        - "1 global-state.access-token-user"
  - id: instance_governance_1
    type: script
    output:
      address: "instance.instance-governance-scripts"
      value: 
        - "1 project.project-nft"
      datum:
        creators: ["<alias_project_creator>"]
        policy_id: "<project_nft_policyid>"

  - id: treasury_1
    type: script
    output:
      address: "project.treasury-scripts"
      value: 
        - "1 project.treasury-token"
      datum:
        projects: ["(<project_new_hash_1>, <int_new_1>)", "(<project_new_hash_2>, <int_new_2>)"]
        policy_id: ["<contributor_state_policyid_new>", "<contributor_state_policyid_new3>"]

  - id: treasury_2
    type: script
    redeemer: "<commit_fund_action>"
    output:
      address: "project.treasury-scripts"
      value: 
        - "10000000 lovelace"