name: AccessTokenMintTransaction

# Metadata about this transaction type
metadata:
  role: "General"
  category: "access_management"
  requires_tokens: ["userStateToken"]
  estimated_fee: "2.5 ADA"
  description: "User mints access tokens (100at, 222at) for protocol participation"
  multi_signature: false

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: user_1
    type: wallet
    output: 
      address: "user"
      value: ["5000000 lovelace"]

  - id: index_1
    type: script
    redeemer: "()"
    output: 
      address: "index"
      value: ['1 index." "']
      datum: "(alice, carol)"

# reference inputs
reference_inputs:
  - id: index_ref_1
    type: script
    output:
      address: "index ref"
      value: ["nft"]
      datum:
        index_data:
          address: "andamio-treasury"
          output_datum: "NoDatum"
          flatten_value: ["5000000 lovelace"]
          observers: ["index_obs_v1"]
      script: "index"

# outputs
outputs:
  - id: user_1
    type: "wallet"
    output:
      address: "user"
      value: ['1 index.222bob']

  - id: index_1
    type: "script"
    output:
      address: "index"
      value: ['1 index." "']
      datum: "(alice, bob)"

  - id: index_2
    type: "script"
    output:
      address: "index"
      value: ['1 index." "']
      datum: '(bob, carol)'
  
  - id: treasury_1
    type: "wallet"
    output:
      address: "andamio-treasury"
      value: ["5000000 lovelace"]

  - id: global_1
    type: "script"
    output:
      address: "global state"
      value: ['1 index.100bob']
      datum: 
        policy_id: "index"
        alias: "bob"
        local_state_information: []
        info: "()"

mints:
  - id: index
    redeemer:
      string: "bob"
    tokens: ['1 index.222bob',
             '1 index.100bob',
             '1 index." "']

# withdrawing
withdraws:
  - id: init_index_obs_v1
    redeemer: "(bob, ())"
    amount: 0