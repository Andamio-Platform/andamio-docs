# Token references use dot notation to map to validator-registry-v1.yaml
# Format: <system>.<token-name> maps to registry path: systems > <system> > tokens > <token-name>

name: AccessTokenMintTransaction
id: general.mint-access-token

# Metadata about this transaction type
metadata:
  role: "general"
  category: "general"
  requires_tokens: ["global-state.access-token-index"]
  estimated_cost: "0 ADA"
  description: "User mints access tokens (100at, 222at) for protocol participation"
  multi_signature: false

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: user_1
    type: wallet
    output: 
      address: "user"
      value:
        - "5000000 lovelace"
  - id: index_1
    type: script
    redeemer: "()"
    output: 
      address: "index-validators.index-scripts"
      value:
        - '1 global-state.access-token-index'
      datum: "(<linked_list_alias_before>, <linked_list_alias_after>)"

# reference inputs
reference_inputs:
  - id: index_ref_1
    type: script
    output:
      address: "index-validators.index-ref"
      value:
        - "1 index-validators.index-scripts-ref-token"
      datum:
        index_data:
          address: "<andamio_protocol_treasury>"
          output_datum: "NoDatum"
          flatten_value: 
            - "5000000 lovelace"
          observers: ["index_obs_v1"]
      script: "index"

# outputs
outputs:
  - id: user_1
    type: "wallet"
    output:
      address: "user"
      value:
        - "1 global-state.access-token-user"
  - id: index_1
    type: "script"
    output:
      address: "index-validators.index-scripts"
      value:
        - '1 global-state.access-token-index'
      datum: "(<linked_list_alias_before>, <alias>)"

  - id: index_2
    type: "script"
    output:
      address: "index-validators.index-scripts"
      value:
        - '1 global-state.access-token-index'
      datum: "(<alias>, <linked_list_alias_after>)"
  
  - id: treasury_1
    type: "wallet"
    output:
      address: "<andamio_protocol_treasury>"
      value:
        - "5000000 lovelace"
  - id: global_1
    type: "script"
    output:
      address: "global-state.global-state"
      value:
        - '1 global-state.access-token-global-state'
      datum: 
        policy_id: "index"
        alias: "<alias>"
        local_state_information: []
        info: "()"

mints:
  - id: index
    policy: "index-validators.index-scripts"
    redeemer:
      string: "<alias>"
    tokens:
      - '1 global-state.access-token-user'
      - '1 global-state.access-token-global-state'
      - '1 global-state.access-token-index'

# withdrawing
withdraws:
  - id: init_index_obs_v1
    observer: "index-validators.init-index-observer"
    redeemer: "(<alias>, ())"
    amount: 0