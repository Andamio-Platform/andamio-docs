name: ContributorCommitProjectTransaction
id: contributor-commit-project

# Metadata about this transaction type
metadata:
  role: "Contributor"
  category: "project_management"
  requires_tokens: ["100at", "contributorNFT"]
  estimated_fee: "3.0 ADA"
  description: "Contributor commits to working on a specific project"
  multi_signature: false

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: ["1 index.222bob",
              "2000000 lovelace"]

  - id: contributor_state_1
    type: script
    redeemer:
      alias: "bob"
      script_hash: "escrow"
    output:
      address: "project.contributor-state-scripts"
      value: ["2 contributor_state.bob"]
      datum: 
        string: ["project hash 2", "project hash 3"]
  
  - id: treasury_1
    type: script
    redeemer:
      policy_id: "contributor_state"
      alias: "bob"
      project_data:
        project_data: "content hash"
        deadline: 16062025
        lovelace_am: 10000000
        flatten_value: []
      script_hash: "escrow"
      maybe_string: "Just some"
    output:
      address: "project.treasury-scripts"
      value: ["1 treasury_token.escrow"]
      datum:
        projects: ["(project hash 1, 1)", "(project hash 2, 10)"]
        policy_id: ["contributor_state", "contributor_state3"]

  - id: treasury_2
    type: script
    redeemer: "CommitFund"
    output:
      address: "project.treasury-scripts"
      value: ["15000000 lovelace"]

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: ["1 index.222bob"]

  - id: contributor_state_1
    type: script
    output:
      address: "project.contributor-state-scripts"
      value: ["1 contributor_state.bob"]
      datum: 
        string: ["project hash 2", "project hash 3"]

  - id: treasury_1
    type: script
    output:
      address: "project.treasury-scripts"
      value: ["1 treasury_token.escrow"]
      datum:
        projects: ["(project hash 2, 10)"]
        policy_id: ["contributor_state", "contributor_state3"]

  - id: treasury_2
    type: script
    output:
      address: "project.treasury-scripts"
      value: ["5000000 lovelace"]
  
  - id: escrow_1
    type: script
    output:
      address: "project.escrow1"
      value: ["1 contributor_state.bob",
              "12000000 lovelace"]
      datum:
        project_data:
          project_data: "content hash"
          deadline: 16062025
          lovelace_am: 10000000
          flatten_value: []
        script_hash: "treasury"
        policy_id: "contributor_state"
        maybe_string: "Nothing"

validity_range:
  invalide_after: 16062024