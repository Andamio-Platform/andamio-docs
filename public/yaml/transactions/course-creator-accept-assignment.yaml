name: CourseCreatorAcceptAssignmentTransaction
id: course-creator-accept-assignment

# Metadata about this transaction type
metadata:
  role: "CourseCreator"
  category: "assignment_management"
  requires_tokens: ["courseCreatorNFT", "100at"]
  estimated_fee: "2.5 ADA"
  description: "Course creator accepts and approves a student's assignment submission"
  multi_signature: false

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "alice"
      value: ["1 index.222alice"]

  - id: instance_governance_1
    type: script
    redeemer: "alice"
    output:
      address: "instance governance"
      value: ["1 nft.CourseNFT"]
      datum:
        creators: ["alice"]
        policy_id: "nft"

  - id: assignment-validator
    type: script
    redeemer: "Accept"
    output:
      address: "assignment"
      value: ["1 course_state.bob"]
      datum:
        string: "101"
        maybe_string: "Just some"
        policy_id: "course_state"
        alias: "bob"
        address: "course_state"
        assignment_list: "string[]"

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "alice"
      value: ["1 index.222alice"]

  - id: instance_governance_1
    type: script
    output:
      address: "instance governance"
      value: ["1 nft.CourseNFT"]
      datum:
        creators: ["alice"]
        policy_id: "nft"

  - id: course_state_1
    type: script
    output:
      address: "assignment"
      value: ["1 course_state.bob"]
      datum:
        assignment_list: "string[]"