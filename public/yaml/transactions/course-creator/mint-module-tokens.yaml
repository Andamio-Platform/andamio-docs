# Token references use dot notation to map to validator-registry-v1.yaml
# Format: <system>.<token-name> maps to registry path: systems > <system> > tokens > <token-name>

name: CourseCreatorMintModuleTokensTransaction
id: course-creator.mint-module-tokens

# Metadata about this transaction type
metadata:
  role: "course-creator"
  category: "course_management"
  requires_tokens: ["global-state.access-token-user", "course.course-nft"]
  estimated_cost: "0 ADA"
  description: "Course creator mints module tokens for course content"
  multi_signature: false

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "course facilitator"
      value: 
        - "1 global-state.access-token-user"
  - id: instance_governance_1
    type: script
    redeemer: ["<alias_course_facilitator>"]
    output:
      address: "instance.instance-governance-scripts"
      value: 
        - "1 course.course-nft"
      datum:
        creators: ["<alias_course_facilitator>"]
        policy_id: "<course_nft_policyid>"

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "course facilitator"
      value: 
        - "1 global-state.access-token-user"
  - id: instance_governance_1
    type: script
    output:
      address: "instance.instance-governance-scripts"
      value: 
        - "1 course.course-nft"
      datum:
        creators: ["<alias_course_facilitator>"]
        policy_id: "<course_nft_policyid>"
  
  - id: module_ref_1
    type: script
    output:
      address: "course.module-ref-validator"
      value: 
        - "1 course.module-token"
      datum:
        module_code: "<module_code>"
        content_hash: "<content_hash>"
        policy_id: "<module_policyid>"

mints:
  - id: module_mint_1
    policy: "course.module-policy"
    redeemer:
      action: "ModuleMint"
      module_code: "<module_code>"
    tokens:
      - "1 course.module-token"