name: ContributorBurnContributorInfoTransaction

# Metadata about this transaction type
metadata:
  role: "Contributor"
  category: "profile_management"
  requires_tokens: ["contributorInfoToken", "contributorNFT"]
  estimated_fee: "1.5 ADA"
  description: "Contributor burns their contributor info token"
  multi_signature: false

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: ["1 index.222<alias>"]

  - id: global_state_1
    type: script
    redeemer: 
      nft: "policy_id"
      project_hash_list: "hash[]"
      contributor_state: "policy_id"
    output:
      address: "global_state"
      value: ["1 index.100<alias>"]
      datum:
        global_state: "policy_id"
        alias: "string"
        local_state_information:
          - nft: "policy_id"
            project_hash_list: "hash[]"
            bool: true
        info: "()"

  - id: contributor_state_1
    type: script
    redeemer:
      alias: "string"
    output:
      address: "contributor_state"
      value: ["2 contributor_state.<alias>"]
      datum: 
        project_hash_list: "hash[]"

# reference inputs
reference-inputs:
  - id: instance_1
    type: script
    output:
      address: "instance"
      value: ["1 instance_provider.ContributorStateScripts"]
      datum: "nft"
      script: "contributor_state"

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: ["1 index.222<alias>"]

  - id: global_state_1
    type: script
    output:
      address: "global_state"
      value: ["1 index.100<alias>"]
      datum:
        global_state: "policy_id"
        alias: "string"
        local_state_information:
          - nft: "policy_id"
            project_hash_list: "hash[]"
            bool: false
        info: "()"

mints:
  - id: contributor_state
    redeemer:
      alias: "string"
    tokens: ["-2 contributor_state.<alias>"]