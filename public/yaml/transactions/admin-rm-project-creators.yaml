name: AdminRmProjectCreatorsTransaction
id: admin-rm-project-creators

# Metadata about this transaction type
metadata:
  role: "InstanceAdmin"
  category: "access_management"
  requires_tokens: ["instanceAdminNFT"]
  estimated_fee: "3.0 ADA"
  description: "Instance admin removes project creators from the platform"
  multi_signature: true
  required_signatures: ["instanceAdmin", "globalAdmin"]

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: instance_governance_1
    type: script
    redeemer: ["alice"]
    output:
      address: "instance.instance-governance-scripts"
      value: ["nft.ProjectNFT"]
      datum:
        creators: ["alice", "bob", "carol"]
        policy_id: "nft"

  - id: instance_admin
    type: wallet
    output:
      address: "instance admin wallet"
      value: ["1 nft.InstanceAdmin"]

# outputs
outputs:
  - id: instance_governance_1
    type: script
    output:
      address: "instance.instance-governance-scripts"
      value: ["1 nft.ProjectNFT"]
      datum:
        creators: ["bob", "carol"]
        policy_id: "nft"