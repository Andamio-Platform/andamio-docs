name: StudentLeaveAssignmentTransaction

# Metadata about this transaction type
metadata:
  role: "Student"
  category: "assignment_management"
  requires_tokens: ["localStateToken", "222at"]
  estimated_fee: "1.5 ADA"
  description: "Student leaves an assignment they previously committed to"
  multi_signature: false

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: ["1 index.222bob"]
  
  - id: assignment_1
    type: script
    redeemer:
      maybe_string: "Nothing"
    output:
      address: "assignment"
      value: ["1 course_state.bob"]
      datum:
        string: "101"
        maybe_string: "Just some"
        policy_id: "course_state"
        alias: "bob"
        address: "course_state"
        assignment_list: ["201", "202", "203"]

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: ["1 index.222bob"]

  - id: course_state_1
    type: script
    output:
      address: "course_state"
      value: ["1 course_state.bob"]
      datum: 
        assignment_list: ["201", "202", "203"]