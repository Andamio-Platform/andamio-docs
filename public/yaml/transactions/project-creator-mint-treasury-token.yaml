name: ProjectCreatorMintTreasuryTokenTransaction
id: project-creator-mint-treasury-token

# Metadata about this transaction type
metadata:
  role: "ProjectCreator"
  category: "treasury_management"
  requires_tokens: ["100at", "projectCreatorNFT"]
  estimated_fee: "3.5 ADA"
  description: "Project creator mints treasury token to initialize project treasury"
  multi_signature: false

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "alice"
      value: ["1 index.222alice"]

  - id: instance_governance_1
    type: script
    redeemer: "alice"
    output:
      address: "instance.instance-governance-scripts"
      value: ["1 nft.ProjectNFT"]
      datum:
        creators: ["alice"]
        policy_id: "nft"

reference_inputs:
  - id: instance_1
    type: script
    output:
      address: "instance.instance-scripts"
      value: ["1 instance_provider.Escrow1"]
      datum: "nft"
      script: "escrow"

  - id: instance_1
    type: script
    output:
      address: "instance.instance-scripts"
      value: ["1 instance_provider.TreasuryScripts"]
      datum: "nft"
      script: "treasury"
# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "alice"
      value: ["1 index.222alice"]

  - id: instance_governance_1
    type: script
    output:
      address: "instance.instance-governance-scripts"
      value: ["1 nft.ProjectNFT"]
      datum:
        creators: ["alice"]
        policy_id: "nft"

  - id: treasury_1
    type: script
    output:
      address: "project.treasury-scripts"
      value: ["1 treasury_token.escrow"]
      datum:
        projects: ["(project hash 1, 3)", "(project hash 2, 5)"]
        policy_id: ["contributor_state", "contributor_state3"]

mints:
  - id: treasury_token
    policy: "project.treasury-token"
    redeemer:
      treasury: "script_hash"
      escrow: "script_hash"
      policy_id: ["contributor_state", "contributor_state3"]
      projects:
        - project_data:
            project_data: "content hash1"
            deadline: 16062027
            lovelace_am: 10000000
            flatten_value: []
          int: 3
        - project_data:
            project_data: "content hash"
            deadline: 16062025
            lovelace_am: 100000000
            flatten_value: []
          int: 5
    tokens: ["1 treasury_token.escrow"]