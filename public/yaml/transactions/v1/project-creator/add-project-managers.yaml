# Token references use dot notation to map to validator-registry-v1.yaml
# Format: <system>.<token-name> maps to registry path: systems > <system> > tokens > <token-name>

name: AddProjectManagers
id: project-creator.add-project-managers

# Metadata about this transaction type
metadata:
  role: "project-creator"
  category: "project"
  requires_tokens: ["global-state.access-token-user", "project.treasury-token"]
  estimated_cost: "10 ADA per manager"
  description: "Adds managers to oversee project contributions and treasury"
  multi_signature: false

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value:
        - "1 global-state.access-token-user"
        - "2000000 lovelace"

  - id: treasury_1
    type: script
    redeemer:
      action: "AddManagers"
      manager_aliases: ["<manager_alias_1>", "<manager_alias_2>"]
    output:
      address: "project.treasury-scripts"
      value:
        - "1 project.treasury-token"
      datum:
        managers: ["<existing_manager_alias>"]
        projects: ["(<project_hash_1>, 1)"]
        policy_id: ["<contributor_state_policyid>"]

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value:
        - "1 global-state.access-token-user"

  - id: treasury_1
    type: script
    output:
      address: "project.treasury-scripts"
      value:
        - "1 project.treasury-token"
      datum:
        managers: ["<existing_manager_alias>", "<manager_alias_1>", "<manager_alias_2>"]
        projects: ["(<project_hash_1>, 1)"]
        policy_id: ["<contributor_state_policyid>"]

  - id: service_fee
    type: wallet
    output:
      address: "<andamio_protocol_treasury>"
      value:
        - "10000000 lovelace"

validity_range:
  invalid_after: <timestamp>
