# Token references use dot notation to map to validator-registry-v1.yaml
# Format: <system>.<token-name> maps to registry path: systems > <system> > tokens > <token-name>

name: AdminInitSingleContributorStateTransaction
id: admin.init-single-contributor-state

# Metadata about this transaction type
metadata:
  role: "admin"
  category: "instance_management"
  requires_tokens: ["instance.instance-admin-token"]
  estimated_cost: "0 ADA"
  description: "Instance admin initializes a single contributor state instance"
  multi_signature: true
  required_signatures: ["instanceAdmin", "multisigInitiator"]

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: instance_admin
    type: wallet
    output:
      address: "instance admin wallet"
      value:
        - "1 instance.instance-admin-token"

# reference inputs
reference_inputs:
  - id: instance_provider
    type: script
    output:
      address: "instance.instance-provider-scripts"
      value:
        - "1 instance.contributor-state-scripts"
      datum: ["contributor_state_logic1", "contributor_state_logic2", "contributor_state_logic3"]
      script: "contributor_state_obs"

# outputs
outputs:
  - id: instance_admin
    type: wallet
    output:
      address: "instance admin wallet"
      value:
        - "1 instance.instance-admin-token"

  - id: contributor_state_instance
    type: script
    output:
      address: "instance.instance-scripts"
      value:
        - "1 project.project-instance-contributor-state-scripts"
      datum:
        policy: "<policy_string>"
        prerequisite: "<prerequisite_string>"
        multisig_native_script_cbor: "<multisig_native_script_cbor>"
      script: "contributor_state_logic1 + <policy_string> + contributor_state_logic2 + <prerequisite_string> + contributor_state_logic3"

# minting
mints:
  - id: instance
    policy: "<instance_policyid>"
    redeemer:
      policy_id: "<policy_string>"
      params: ["<policy_string>", "<prerequisite_string>"]
      token_name: "ContributorStateScripts"
      multisig_native_script_cbor: "<multisig_native_script_cbor>"
      multisig_initiator_address: "<multisig_initiator_address>"
    tokens:
      - "1 project.project-instance-contributor-state-scripts"

# withdrawing
withdraws:
  - id: contributor_state_obs
    observer: "project.contributor-state-cbor-obs"
    redeemer:
      tx_id: "string"
      tx_ix: "string"
    amount: 0
