# Token references use dot notation to map to validator-registry-v1.yaml
# Format: <system>.<token-name> maps to registry path: systems > <system> > tokens > <token-name>

name: AddCourseManagers
id: course-creator.add-course-managers

# Metadata about this transaction type
metadata:
  role: "course-creator"
  category: "course"
  requires_tokens: ["global-state.access-token-user", "course.course-state-token"]
  estimated_cost: "10 ADA per manager"
  description: "Adds managers to oversee course and review student assignments"
  multi_signature: false

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value:
        - "1 global-state.access-token-user"
        - "2000000 lovelace"

  - id: course_state_1
    type: script
    redeemer:
      action: "AddManagers"
      manager_aliases: ["<manager_alias_1>", "<manager_alias_2>"]
    output:
      address: "course.course-state-scripts"
      value:
        - "1 course.course-state-token"
      datum:
        managers: ["<existing_manager_alias>"]
        course_data: "<course_content_hash>"

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value:
        - "1 global-state.access-token-user"

  - id: course_state_1
    type: script
    output:
      address: "course.course-state-scripts"
      value:
        - "1 course.course-state-token"
      datum:
        managers: ["<existing_manager_alias>", "<manager_alias_1>", "<manager_alias_2>"]
        course_data: "<course_content_hash>"

  - id: service_fee
    type: wallet
    output:
      address: "<andamio_protocol_treasury>"
      value:
        - "10000000 lovelace"

validity_range:
  invalid_after: <timestamp>
