# Token references use dot notation to map to validator-registry-v1.yaml
# Format: <system>.<token-name> maps to registry path: systems > <system> > tokens > <token-name>

name: StudentLeaveAssignmentTransaction
id: student.leave-assignment

# Metadata about this transaction type
metadata:
  role: "student"
  category: "assignment_management"
  requires_tokens: ["global-state.access-token-user", "course.course-state-token"]
  estimated_cost: "0 ADA"
  description: "Student leaves an assignment they previously committed to"
  multi_signature: false

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "student"
      value: 
        - "1 global-state.access-token-user"
  
  - id: assignment_1
    type: script
    redeemer:
      maybe_string: "Nothing"
    output:
      address: "course.assignment-validator"
      value: 
        - "1 course.course-state-token"
      datum:
        string: "101"
        maybe_string: "Just some"
        policy_id: "course_state"
        alias: "bob"
        address: "course_state"
        assignment_list: ["201", "202", "203"]

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "student"
      value: 
        - "1 global-state.access-token-user"
  - id: course_state_1
    type: script
    output:
      address: "course.course-state-validator"
      value: 
        - "1 course.course-state-token"
      datum: 
        assignment_list: ["201", "202", "203"]