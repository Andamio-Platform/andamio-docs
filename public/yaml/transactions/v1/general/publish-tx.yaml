# Token references use dot notation to map to validator-registry-v1.yaml
# Format: <system>.<token-name> maps to registry path: systems > <system> > tokens > <token-name>

name: PublishTx
id: general.publish-tx

# Metadata about this transaction type
metadata:
  role: "general"
  category: "general"
  requires_tokens: ["global-state.access-token-user"]
  estimated_cost: "0 ADA"
  description: "Pays service fee to publish a course or project local state to the blockchain"
  multi_signature: false

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# outputs
outputs:
  - id: service_fee
    type: wallet
    output:
      address: "course facilitator"
      value: 
        - "150000000 lovelace"