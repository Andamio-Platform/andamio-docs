# Token references use dot notation to map to validator-registry-v1.yaml
# Format: <system>.<token-name> maps to registry path: systems > <system> > tokens > <token-name>

name: MoveGlobalStateV1ToV2
id: user.move-global-state-v1-v2

# Metadata about this transaction type
metadata:
  role: "user"
  category: "user"
  requires_tokens: ["global-state.access-token-user", "global-state.access-token-global-state"]
  estimated_cost: "0 ADA"
  description: "User moves his global state v1 data to global state v2"
  multi_signature: false

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: user_1
    type: wallet
    output: 
      address: "user"
      value:
        - "1 global-state.access-token-user"

  - id: global_state_1
    type: script
    redeemer: "()"
    output:
      address: "global-state.global-state"
      value: 
        - "1 global-state.access-token-global-state"
      datum:
        policy_id: "global_state"
        alias: "bob"
        local_state_information:
          - nft: "project_nft_policyid"
            string: ["101", "102", "103"]
            bool: false
        info: "()"

# reference inputs
reference_inputs:
  - id: index_ref_1
    type: script
    output:
      address: "index-validators.index-ref"
      value:
        - "1 index-validators.index-scripts-ref-token"
      datum:
        index_data:
          address: "<andamio_protocol_treasury>"
          output_datum: "NoDatum"
          flatten_value: 
            - "5000000 lovelace"
          observers: ["index_obs_v2"]
      script: "index"

# outputs
outputs:
  - id: user_1
    type: "wallet"
    output:
      address: "user"
      value:
        - "1 global-state.access-token-user"

  - id: global_state_v2_1
    type: "script"
    output:
      address: "global-state.global-state-v2"
      value:
        - '1 global-state.access-token-global-state'
      datum:
        alias: "<alias>"
        local_states:
          - nft: "<project_nft_policyid>"
            data_hash: "101 + 102 + 103 + ''"

# withdrawing
withdraws:
  - id: index_obs_v2
    observer: "index-validators.init-index-observer-v2"
    redeemer: "alias"
    amount: 0