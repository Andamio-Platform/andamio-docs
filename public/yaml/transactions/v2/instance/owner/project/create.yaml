design_notes:
  projectId_pattern: |
    Like courses, the projectId IS the LocalStateNFT minting policy ID.
    This parameterized policy ensures uniqueness and ties project identity to the NFT.

  shared_governance: |
    Projects REUSE the course-governance-validator and course-governance-policy.
    The governance UTxO holds a list of managers (for projects) or teachers (for courses).
    This is a major architectural decision - governance is unified.

  treasury_system: |
    Projects have a two-part treasury system:
    1. treasury-script-validator: Holds TreasuryScriptV2 token + embedded validator reference
    2. treasury-validator: Holds actual funds with treasury token

  stake_registration: |
    Project creation registers a stake credential for the project state.
    The credential hash becomes the project-state token name.
    This enables the project-state-validator to track state via stake operations.

  prereq_observer: |
    The project-prereq-observer validates course prerequisites.
    Contributors must have completed specified modules before joining.
    Redeemer contains a map of course_id -> required_module_hashes.

  two_observers: |
    Unlike course.create (1 observer), project.create uses 2 observers:
    1. project-observer: Validates access token ownership
    2. project-prereq-observer: Validates course prerequisite completion

  reused_validators: |
    Several validators/policies are shared with courses:
    - local-state-nft-validator (same address)
    - local-state-token-validator (same address)
    - governance-validator (same address)
    - governance-policy (same policy ID)
    - local-state-token-policy (same policy ID)
    - index-policy (same policy ID)

