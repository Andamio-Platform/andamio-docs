    description: "Script reference for governance validator (shared)"

outputs:
  - id: user-token-return
    type: wallet
    address: "{user_wallet}"
    value:
      - "~1146460 lovelace"
      - "1 index-policy.u{alias}"
    description: "User's access token returned to wallet"

  - id: local-state-nft-output
    type: script
    validator: local-state-nft-validator
    address: "addr_test1xpluky2stsckzgwldqn7ke6vw8ygcj5awefw56u7ye2t6dje040rfxn88d94ckqzkq2h7lcmqzq995dxnqe8kl97w0lqd8z70g"
    value:
      - "~1236970 lovelace"
      - "1 {projectId-policy}.LocalStateNFT"
    datum:
      type: inline
      format: "bytes"
      value: "{owner_alias}"
      example: "6a616d6573 = 'james'"
    description: "LocalStateNFT held at validator - same as courses"

  - id: local-state-token-output
    type: script
    validator: local-state-token-validator
    address: "addr_test1xzg75rsctuuehzam9dwefsuh6sfzkzgddlw9w822q4xu3uvju93gql04ja36fs0af42vadhn8jhre6u2pm2vjltgyfsqymejt5"
    value:
      - "~15447040 lovelace"
      - "1 local-state-token-policy.LocalStateToken"
    datum:
      type: inline
      format: "bytes"
      value: "{projectId}"
      example: "f4e603c8b5baef8874f525aff364a1205e0627cee968a291e2689313"
    hasScriptRef: true
    scriptRefNote: "Embedded project validator script reference (treasury scripts)"
    description: "LocalStateToken with embedded project validator - same pattern as courses"

  - id: governance-output
    type: script
    validator: governance-validator
    address: "addr_test1xzay57ateehcgr5p07hc9juqjjhvmjseyzgf6jmrs6pjydje040rfxn88d94ckqzkq2h7lcmqzq995dxnqe8kl97w0lqk499tw"
    value:
      - "~1357650 lovelace"
      - "1 governance-policy.{projectId}"
    datum:
      type: inline
      format: "list"
      description: "List of manager aliases"
      example: "[\"james\", \"nelsonksh\"]"
    description: "Project governance - REUSES course-governance-validator and policy"
    note: "Same validator/policy handles both course teachers and project managers"

  - id: treasury-script-output
    type: script
    validator: treasury-script-validator
    address: "addr_test1xqxe8wzl6xt4usymulrrpqrqanrkydycgaxyus76fjp6tt2e040rfxn88d94ckqzkq2h7lcmqzq995dxnqe8kl97w0lq5mh58d"
    value:
      - "~20162180 lovelace"
      - "1 treasury-script-policy.TreasuryScriptV2"
    datum:
      type: inline
      format: "bytes"
      value: "{projectId}"
      example: "f4e603c8b5baef8874f525aff364a1205e0627cee968a291e2689313"
    hasScriptRef: true
    scriptRefNote: "Embedded treasury validator script reference"
    description: "Treasury script holder - contains treasury validator reference"

  - id: project-state-output
    type: script
    validator: project-state-validator
    address: "addr_test1xqcucd7rdvhq0d5x6cx87xmehg6l7ul0ld7sru86l8q03g6e040rfxn88d94ckqzkq2h7lcmqzq995dxnqe8kl97w0lq54qulh"
    value:
      - "~1439540 lovelace"
      - "1 project-state-policy.{credential_hash}"
    datum:
      type: inline
      format: "constructor 0"
      fields:
        - name: "projectId"
          type: "bytes"
          description: "Project NFT policy ID"
        - name: "blacklist"
          type: "list"
          description: "Contributor blacklist (empty on creation)"
        - name: "metadata"
          type: "bytes"
          description: "Additional metadata (empty on creation)"
      example:
        constructor: 0
        fields:
          - "f4e603c8b5baef8874f525aff364a1205e0627cee968a291e2689313"
          - []
          - ""
    description: "Project state UTxO - tracks blacklist and project metadata"

  - id: treasury-output
    type: script
    validator: treasury-validator
    address: "addr_test1xrrte4getxntj3k4n450psfgsm53vjuyhpncv5u8xp2fmd6e040rfxn88d94ckqzkq2h7lcmqzq995dxnqe8kl97w0lqeguy9v"
    value:
      - "{deposit_value lovelace}"
      - "1 treasury-token-policy.{treasury_token_name}"
    datum:
      type: inline
      format: "list"
      description: "Treasury transactions list (empty on creation)"
      example: "[]"
    description: "Project treasury holding deposited funds"
    note: "Treasury token name is a hash"

  - id: protocol-fee
    type: wallet
