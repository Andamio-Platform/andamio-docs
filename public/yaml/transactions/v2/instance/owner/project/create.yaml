    description: "Protocol fee = 100 ADA base + 10 ADA per manager (e.g., 2 managers = 120 ADA)"

  - id: change
    type: wallet
    address: "{user_wallet}"
    value:
      - "remaining lovelace"
    description: "Change returned to user wallet (multiple UTxOs in practice)"

