# V2 Transaction: Instance Owner Project Create
# Source: Decoded from CBOR transaction
# API: POST /v2/tx/instance/owner/project/create

name: InstanceOwnerProjectCreateV2
id: instance.owner.project.create

metadata:
  role: "owner"
  system: "instance"
  description: "Create a new project with treasury, managers, and optional course prerequisites"
  api_endpoint: "/v2/tx/instance/owner/project/create"

request_body:
  description: "CreateProjectTxRequest"
  fields:
    alias:
      type: string
      required: true
      description: "Owner's access token alias"
      example: "james"
    course_prereqs:
      type: "[[course_id, [slt_hash]]]"
      required: true
      description: "Course prerequisite requirements. Each entry is [course_id, [module_hashes]] where course_id is the course's LocalStateNFT policy ID and module_hashes are required completed modules."
      example:
        - - "7ab75aa33060796d464762a3a81f6332b54592f03ed623d6f2c32841"
          - ["356be366236f712c2397b3c151ae8ed4656e2574aabfb637ef44ae8345ce9b9a"]
      note: "Empty array = no prerequisites"
    deposit_value:
      type: "[[asset_unit, amount]]"
      required: true
      description: "Initial treasury deposit. Array of [asset_unit, amount] pairs."
      example:
        - ["lovelace", 200000000]
      note: "Empty array = no initial deposit"
    managers:
      type: "string[]"
      required: true
      description: "List of manager aliases (like teachers for courses)"
      example: ["james", "nelsonksh"]

response:
  description: "UnsignedTxResponse with project_id"
  fields:
    project_id:
      type: string
      description: "Project NFT policy ID - THIS IS THE projectId"
      example: "f4e603c8b5baef8874f525aff364a1205e0627cee968a291e2689313"
    unsigned_tx:
      type: string
      description: "CBOR-encoded unsigned transaction"

costs:
  txFee: 1298574
  protocolFee: 120000000
  protocolFeeFormula: "100 ADA base + 10 ADA × number of managers"
  protocolFeeExample: "2 managers = 100 + (2 × 10) = 120 ADA"
  protocolFeeUpcoming:
    note: "First manager will be free in upcoming update"
    newFormula: "100 ADA base + 10 ADA × (managers - 1)"
    newExample: "1 manager = 100 ADA, 2 managers = 110 ADA"
  protocolFeeDestination: instance-treasury
  stakeRegistration: 2000000
  minUtxo:
    user-token-output: 1146460
    local-state-nft-output: 1236970
    local-state-token-output: 15447040
    governance-output: 1357650
    treasury-script-output: 20162180
    project-state-output: 1439540
    treasury-output: "{deposit_value + minUtxo}"
  executionUnits:
    mint_0_treasury_script:
      mem: 587159
      steps: 188113819
    mint_1_project_state:
      mem: 223828
      steps: 74368575
    mint_2_treasury_token:
      mem: 145406
      steps: 51977069
    mint_3_governance:
      mem: 875713
      steps: 262559223
    mint_4_local_state_token:
      mem: 358218
      steps: 109781507
    mint_5_local_state_nft:
      mem: 65229
      steps: 27863007
    cert_0:
      mem: 20513
      steps: 5189996
    withdraw_0_project_observer:
      mem: 409830
      steps: 129547187
    withdraw_1_prereq_observer:
      mem: 528908
      steps: 176027517
  note: "Complex transaction with 6 mints, 2 observers, stake registration. Costs scale with prereqs and deposit complexity."

inputs:
  - id: wallet-inputs
    type: wallet
    address: "{user_wallet}"
    description: "User's wallet providing ADA for fees, deposits, and minUtxO"

  - id: access-token-utxo
    type: wallet
    address: "{user_wallet}"
    value:
      - "1 index-policy.u{alias}"
    description: "Owner's access token UTxO - proves identity"

reference_inputs:
  - id: ref-0
    utxo: "23c2fca5930e93066df6edc90af902ff87db1480f5d3442531ec8f55b85d6d26#0"
    description: "Script reference"

  - id: ref-1
    utxo: "3206c0ae47250b0007d4f24bab437a1e529cf59a07999ef73adfcb47e6e475a9#0"
    description: "Script reference"

  - id: ref-2
    utxo: "3206c0ae47250b0007d4f24bab437a1e529cf59a07999ef73adfcb47e6e475a9#1"
    description: "Script reference"

  - id: ref-3
    utxo: "57701f1a1870c1786524f0462b608e1fb8f597694c49c18cea058032812c7937#4"
    description: "Script reference (shared with course.create)"

  - id: ref-4
    utxo: "5fe4495c1d6786a43813585ebd2e901c485cef5a5e4fa8d33d7c5bcf3b22e1bc#0"
    description: "Script reference (shared with course.create)"

  - id: ref-5
    utxo: "957a855b5ae7fefe3d13c051f2f3234674c765c7cf986244ae5a2a5960d59fd4#2"
    description: "Script reference"

  - id: ref-6
    utxo: "ae34090af3fc21bf41384a507eef48ab72009b6c513ba5f7e0aea738ca3523db#0"
