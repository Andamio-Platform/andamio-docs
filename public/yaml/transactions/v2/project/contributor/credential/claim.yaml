# V2 Transaction: Project Contributor Credential Claim
# Source: Decoded from CBOR transaction
# API: POST /v2/tx/project/contributor/credential/claim

name: ProjectContributorCredentialClaimV2
id: project.contributor.credential.claim

metadata:
  role: "contributor"
  system: "project"
  description: "Claim project credential by burning contributor state token"
  api_endpoint: "/v2/tx/project/contributor/credential/claim"

request_body:
  description: "CredentialClaimTxRequest"
  fields:
    alias:
      type: string
      required: true
      description: "Contributor's access token alias"
      example: "student_001"
    project_id:
      type: string
      required: true
      description: "Project NFT policy ID (56 char hex)"
      example: "3b20d771fff69738127691ec3aea3803cdae1b1292ed1e1ca62a5f30"
    contributor_state_id:
      type: string
      required: true
      description: "Contributor state policy ID"
      example: "c69d2d5d5889edda8aa30550c340303ff7c9e74dd01c028528e24495"

response:
  description: "UnsignedTxResponse"
  fields:
    unsigned_tx:
      type: string
      description: "CBOR-encoded unsigned transaction"

costs:
  txFee: 348287
  protocolFee: 1000000
  protocolFeeAda: "1 ADA"
  protocolFeeDestination: "instance-treasury"
  protocolFeeNote: "1 ADA protocol fee for credential claim"
  minUtxo:
    global-state-output: 2111900
    user-token-output: 1172320
  executionUnits:
    spend_1_global_state:
      mem: 189650
      steps: 66014459
    spend_2_contributor_state:
      mem: 163708
      steps: 62989923
    mint_0_burn:
      mem: 134261
      steps: 47189915
  collateral: 522431
  walletDelta:
    note: "NET GAIN - contributor gets back deposit minus fees"
    estimate: "Contributor state deposit (~14.5 ADA) - txFee (~0.35) - protocolFee (1) = ~13+ ADA back"
  note: "BURNS contributor-state token, unlocking enrollment deposit"

inputs:
  - id: access-token-utxo
    type: wallet
    address: "{user_wallet}"
    utxo: "5d73ba5601f4ddfdeb8a1e405be7877dabff480d02e033464a109fffe96010e2#0"
    value:
      - "1 index-policy.u{alias}"
    description: "Contributor's access token UTxO"

  - id: global-state-input
    type: script
    validator: global-state-v2
    address: "addr_test1xr2ujzcqsq0pwfua3qnjxy4444kw5dng593gn7e4jflyaauju93gql04ja36fs0af42vadhn8jhre6u2pm2vjltgyfsq764wdy"
    utxo: "5d73ba5601f4ddfdeb8a1e405be7877dabff480d02e033464a109fffe96010e2#1"
    redeemer:
      tag: "Spend"
      index: 1
      data: "{constructor: 1, fields: [projectId, 0, '', contributor_state_id, credential_hash]}"
      structure:
        constructor: 1
        fields:
          - projectId: "bytes - project policy ID"
          - flag: "0 (credential claim flag)"
          - empty: "bytes (empty)"
          - contributor_state_id: "bytes - contributor state policy ID"
          - credential_hash: "bytes - computed credential hash"
      example: "{constructor:1, fields:['3b20d771...', 0, '', 'c69d2d5d...', '2ba070a7...']}"
    description: "Global state UTxO - spent to update credentials map with credential hash"

  - id: contributor-state-input
    type: script
    validator: contributor-state-validator
    address: "addr_test1xrrf6t2atzy7mk525vz4ps6qxqll0j08fhgpcq599r3yf92e040rfxn88d94ckqzkq2h7lcmqzq995dxnqe8kl97w0lq63d6dc"
    utxo: "7066f83381d834d3346fa80d67dbfa3ed6704f8201e5f6c16be651a5947d847a#1"
    redeemer:
      tag: "Spend"
      index: 2
      data: "{constructor: 1, fields: []}"
      description: "Constructor 1 = claim/burn action for contributor-state"
    description: "Contributor state UTxO - BURNED to claim credential"

reference_inputs:
  - id: ref-0
    utxo: "957a855b5ae7fefe3d13c051f2f3234674c765c7cf986244ae5a2a5960d59fd4#1"
    description: "Script reference for contributor-state-policy"

  - id: ref-1
    utxo: "aae8f2e874289c1c961a09728288832668f709c8b2efe91b6a26cd041924c37a#2"
    description: "Script reference for global-state-v2"

outputs:
  - id: user-token-return
    type: wallet
    address: "{user_wallet}"
    value:
      - "~1172320 lovelace"
      - "1 index-policy.u{alias}"
    description: "Contributor's access token returned to wallet"

  - id: global-state-output
    type: script
    validator: global-state-v2
    address: "addr_test1xr2ujzcqsq0pwfua3qnjxy4444kw5dng593gn7e4jflyaauju93gql04ja36fs0af42vadhn8jhre6u2pm2vjltgyfsq764wdy"
    value:
      - "~2111900 lovelace"
      - "1 index-policy.g{alias}"
    datum:
      type: inline
      format: "constructor 0"
      fields:
        - alias: "bytes"
        - credentials_map: "map of {policyId -> credential_hash}"
      example: "{constructor:0, fields:['student_001', {projectId -> 'e2792989...', ...}]}"
      note: "Project credential hash permanently stored in credentials map"
    description: "Global state updated with project credential hash"

  - id: protocol-fee-output
    type: wallet
    address: "addr_test1qpuptlg3kgtcq0rq8rq0z7w8pp0j7p98whvsg4wp6c0mngu7nalltfu076ak2qfw0p2ghn5svge4pm78gpfr6rl8rtrszh0nq3"
    value:
      - "1000000 lovelace"
    description: "1 ADA protocol fee to instance treasury"

  - id: change
    type: wallet
    address: "{user_wallet}"
    value:
      - "remaining lovelace"
    description: "Change returned to user wallet (multiple UTxOs) - includes unlocked deposit"

mints:
  - id: contributor-state-burn
    policy: contributor-state-policy
    policyId: "c69d2d5d5889edda8aa30550c340303ff7c9e74dd01c028528e24495"
    redeemer:
      tag: "Mint"
      index: 0
      data: "{constructor: 3, fields: [alias, completed_tasks_list]}"
      structure:
        constructor: 3
        fields:
          - alias: "bytes - contributor alias"
          - completed_tasks: "list of completed task entries"
      example: "{constructor:3, fields:['student_001', [{constructor:0, fields:['', '', 12500000]}]]}"
      description: "Burn redeemer includes completed tasks proof"
    tokens:
      - quantity: -1
        name: "{alias}"
        hex_name: "73747564656e745f303031"
        description: "Contributor state token BURNED (negative quantity)"
    description: "Burns contributor-state token to claim credential"

withdraws: null
# No observer for credential claim - direct validator logic

design_notes:
  analogous_to_course_claim: |
    This transaction is the project equivalent of course/student/credential/claim.
    Contributor burns their state token to permanently record the credential.

  burns_contributor_state_token: |
    The contributor-state token is BURNED (quantity = -1).
    This releases the enrollment deposit (~14.5 ADA) back to the contributor.
    The mint redeemer includes proof of completed tasks.

  global_state_update: |
    The global-state-v2 UTxO is spent and recreated.
    The credentials map is updated: projectId value changes from placeholder to credential_hash.
    Redeemer flag = 0 indicates credential claim action (vs -1 for enrollment).

  credential_hash: |
    The credential hash (e2792989258790b5898422733742a7a94dfa942e41e718e5d41e5deb50eb2bc8)
    is computed from the completed tasks and permanently stored in global state.
    This proves the contributor completed project work.

  protocol_fee: |
    Unlike task-commit and tasks-assess which have no protocol fee,
    credential claim charges 1 ADA to instance-treasury.
    This is the same treasury that receives course/project creation fees.

  net_wallet_gain: |
    Despite the fees, contributor gets a NET GAIN:
    - Contributor state deposit unlocked: ~14.5 ADA
    - Minus tx fee: ~0.35 ADA
    - Minus protocol fee: 1 ADA
    - Net gain: ~13+ ADA back to wallet

  spend_redeemer_difference: |
    Note: Contributor-state uses constructor 1 for claim (not constructor 3).
    This differs from course-state which uses constructor 3 for claim.
    The mint policy uses constructor 3 for burn.

registry:
  validators:
    global-state-v2:
      address: "addr_test1xr2ujzcqsq0pwfua3qnjxy4444kw5dng593gn7e4jflyaauju93gql04ja36fs0af42vadhn8jhre6u2pm2vjltgyfsq764wdy"
    contributor-state-validator:
      address: "addr_test1xrrf6t2atzy7mk525vz4ps6qxqll0j08fhgpcq599r3yf92e040rfxn88d94ckqzkq2h7lcmqzq995dxnqe8kl97w0lq63d6dc"
      note: "Parameterized per project"
  policies:
    contributor-state-policy:
      policyId: "c69d2d5d5889edda8aa30550c340303ff7c9e74dd01c028528e24495"
      note: "Token burned with constructor 3 redeemer"
  wallets:
    instance-treasury:
      address: "addr_test1qpuptlg3kgtcq0rq8rq0z7w8pp0j7p98whvsg4wp6c0mngu7nalltfu076ak2qfw0p2ghn5svge4pm78gpfr6rl8rtrszh0nq3"
      note: "Receives 1 ADA protocol fee"
