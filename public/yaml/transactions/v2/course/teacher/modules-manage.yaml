# Token references use dot notation to map to address-registry.json
# Format: <category>.<name> maps to registry path

name: "Manage Course Modules"
id: "course.teacher.modules-manage"

metadata:
  role: "teacher"
  system: "course"
  description: "Mint, update, or burn course modules (SLT collections)"
  api_endpoint: "/tx/v2/teacher/course/modules/manage"

# Example: Simple module mint (single module with 2 SLTs)
example_context:
  teacher_alias: "james"
  course_id: "23a6bbce3a8deca8985764e847594f6956c9dc643e3f6c8efdba04e4"
  module_slts:
    - "I can mint an access token."
    - "I can complete an assignment to earn a credential."
  module_token_hash: "8dcbe1b925d87e6c547bbd8071c23a712db4c32751454b0948f8c846e9246b5c"

inputs:
  - id: teacher_access_token
    type: wallet
    label: "teacher-wallet"
    description: "Teacher's access token UTxO"
    value:
      - "~1200000 lovelace"
      - "1 policies.index-policy::u<teacher_alias>"
    notes: "Access token proves teacher identity"

  - id: course_governance
    type: script
    validator: "course-governance-validator"
    description: "Course governance UTxO (spent to verify teacher authorization)"
    value:
      - "lovelace"
      - "1 policies.course-governance-policy::<course_id>"
    datum:
      teachers: ["<teacher_pkh>"]
    notes: "Verifies teacher is in the teachers list"

reference_inputs:
  - id: script_ref
    description: "Script reference for module policy"
    tx_id: "1937336fdedcd62c377c898494e98bec611b5673c7621aad6e8a79e536b9609a"
    index: 4
    notes: "New script reference observed in this transaction"

  - id: course_nft_ref
    description: "Course NFT reference (proves course exists)"
    source: "Same tx as course_governance input"
    index: 3
    notes: "Reference to course LocalStateNFT"

outputs:
  - id: teacher_access_token_return
    type: wallet
    label: "teacher-wallet"
    description: "Return teacher's access token"
    value:
      - "~1146460 lovelace"
      - "1 policies.index-policy::u<teacher_alias>"

  - id: module_utxo
    type: script
    validator: "module-validator"
    description: "New module UTxO at module validator"
    value:
      - "~1590390 lovelace"
      - "1 policies.module-policy::<slt_hash>"
    datum:
      format: "constructor 0"
      fields:
        course_creator_pkh: "<course_creator_pkh>"
        teachers: ["<teacher_pkh>"]
        additional_data: "[] (empty list - may be for allowed students or prerequisites)"
    notes: "Module token name is SHA256 hash of SLTs"

  - id: course_governance_return
    type: script
    validator: "course-governance-validator"
    description: "Return course governance UTxO"
    value:
      - "lovelace"
      - "1 policies.course-governance-policy::<course_id>"
    datum:
      teachers: ["<teacher_pkh>"]
    notes: "Governance UTxO returned unchanged (implied - need to verify)"

  - id: change
    type: wallet
    label: "teacher-wallet"
    description: "Change outputs to teacher wallet"
    value:
      - "remaining lovelace"

mints:
  - id: mint_module_token
    policy: "policies.module-policy"
    redeemer:
      format: "constructor 0"
      fields:
        alias: "<teacher_alias>"
        course_id: "<course_creator_pkh>"
        modules:
          - slts: ["<slt_1>", "<slt_2>", "..."]
    tokens:
      - "1 policies.module-policy::<slt_hash>"
    notes: "Token name is hash of SLT list"

fees:
  transaction_fee: "271720"
  collateral: "407580"
  service_fee: null
  notes: "No service fee to instance treasury observed in this simple example"

observations:
  - "Module token name is 32-byte hash (likely SHA256 of SLTs)"
  - "Module validator is different from course-governance-validator"
  - "Course governance UTxO is spent (not just referenced) to verify teacher"
  - "Redeemer contains full SLT text, hash is computed on-chain"
  - "Simple mint only - update and burn operations will have different patterns"
  - "No instance treasury fee observed in this transaction"

questions:
  - "Is the module token name SHA256 or Blake2b hash of SLTs?"
  - "What determines allowedStudents and prerequisiteAssignments in the datum?"
  - "Where does the course governance UTxO go? (need to verify output index)"
