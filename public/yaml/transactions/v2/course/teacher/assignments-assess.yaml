# Token references use dot notation to map to address-registry.json
# Format: <category>.<name> maps to registry path

name: "Assess Student Assignments"
id: "course.teacher.assignments-assess"

metadata:
  role: "teacher"
  system: "course"
  description: "Teacher accepts or rejects student assignment submissions"
  api_endpoint: "/tx/v2/teacher/course/assignments/assess"

# Example: Teacher accepting a single assignment
example_context:
  teacher_alias: "james"
  student_alias: "manager_001"
  course_id: "23a6bbce3a8deca8985764e847594f6956c9dc643e3f6c8efdba04e4"
  outcome: "accept"
  slt_hash: "8dcbe1b925d87e6c547bbd8071c23a712db4c32751454b0948f8c846e9246b5c"

inputs:
  - id: teacher_access_token
    type: wallet
    label: "teacher-wallet"
    description: "Teacher's access token UTxO"
    value:
      - "~1146460 lovelace"
      - "1 policies.index-policy::u<teacher_alias>"
    notes: "Proves teacher identity"

  - id: teacher_wallet
    type: wallet
    label: "teacher-wallet"
    description: "Teacher's wallet UTxO for fees"

  - id: student_course_state
    type: script
    validator: "course-state-validator"
    description: "Student's course state UTxO (spent to update assignment status)"
    value:
      - "lovelace"
      - "1 policies.course-state-policy::<student_alias>"
    datum:
      format: "constructor 1"
      description: "Pending assignment state"
      fields:
        slt_hash: "<slt_hash>"
        assignment_info: "<submission_info>"
        additional: "[]"
    redeemer:
      format: "constructor 2"
      fields:
        teacher_alias: "<teacher_alias>"
      notes: "Constructor 2 = assess/accept action"

  - id: additional_input
    type: wallet
    label: "teacher-wallet"
    description: "Additional input (possibly module-related)"
    notes: "Purpose to be confirmed"

reference_inputs:
  - id: module_ref
    description: "Module reference for SLT validation"
    tx_id: "d444817dee91de3f0836d304b2ba576b751fa8400244258be82efc1c1633f733"
    index: 2
    notes: "Contains module token with SLT hash"

  - id: course_nft_ref
    description: "Course NFT reference (proves course exists)"
    tx_id: "d444817dee91de3f0836d304b2ba576b751fa8400244258be82efc1c1633f733"
    index: 3
    notes: "LocalStateNFT for course verification"

outputs:
  - id: teacher_access_token_return
    type: wallet
    label: "teacher-wallet"
    description: "Return teacher's access token"
    value:
      - "~1146460 lovelace"
      - "1 policies.index-policy::u<teacher_alias>"

  - id: student_course_state_updated
    type: script
    validator: "course-state-validator"
    description: "Updated student course state with ACCEPTED assignment"
    value:
      - "~1379200 lovelace"
      - "1 policies.course-state-policy::<student_alias>"
    datum:
      format: "constructor 0"
      description: "Completed assignment state"
      fields:
        completed_slts: ["<slt_hash>"]
    notes: "Datum changes from constructor 1 (pending) to constructor 0 (completed)"

  - id: teacher_change
    type: wallet
    label: "teacher-wallet"
    description: "Change outputs to teacher wallet"
    value:
      - "remaining lovelace"

# No minting - spend and recreate pattern
mints: null

fees:
  transaction_fee: "281358"
  collateral: "422037"
  service_fee: null
  minUtxo_delta: "~-70000"
  wallet_delta: "~210000"
  notes: "Wallet cost ~0.21 ADA = tx fee - minUTxO refund (datum shrinks from pending to completed)"

observations:
  - "NO MINTING - this is a spend-and-recreate pattern"
  - "Course state datum changes from constructor 1 to constructor 0 on accept"
  - "Completed SLTs are stored as a list in the updated datum"
  - "Redeemer constructor 2 indicates assess/accept action"
  - "Teacher alias in redeemer for authorization verification"
  - "No service fee charged for assessments"
  - "Can batch multiple decisions in single transaction (array in request)"
  - "Datum shrinks (drops assignment_info), so minUTxO decreases - teacher gets partial refund"

questions:
  - "What is constructor meaning? 0=completed, 1=pending, 2=rejected?"
  - "How does reject work? Different datum structure?"
  - "What happens to the course state on reject?"
