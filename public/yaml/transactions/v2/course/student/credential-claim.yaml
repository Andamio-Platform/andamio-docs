# Token references use dot notation to map to address-registry.json
# Format: <category>.<name> maps to registry path

name: "Claim Course Credential"
id: "course.student.credential-claim"

metadata:
  role: "student"
  system: "course"
  description: "Student claims credential by burning course state token after completing assignments"
  api_endpoint: "/tx/v2/student/course/credential/claim"

# Example: Student claiming credential after course completion
example_context:
  student_alias: "manager_001"
  course_id: "23a6bbce3a8deca8985764e847594f6956c9dc643e3f6c8efdba04e4"
  completed_slt: "8dcbe1b925d87e6c547bbd8071c23a712db4c32751454b0948f8c846e9246b5c"

inputs:
  - id: student_course_state
    type: script
    validator: "course-state-validator"
    description: "Student's course state UTxO (BURNED to claim credential)"
    value:
      - "lovelace"
      - "1 policies.course-state-policy::<student_alias>"
    datum:
      format: "constructor 0"
      description: "Completed assignment state"
      fields:
        completed_slts: ["<slt_hash>"]
    redeemer:
      format: "constructor 3"
      fields: []
      description: "Burn/claim action - empty fields"
    notes: "Course state consumed and token burned"

  - id: student_access_token
    type: wallet
    label: "student-wallet"
    description: "Student's access token UTxO"
    value:
      - "~1172320 lovelace"
      - "1 policies.index-policy::u<student_alias>"
    notes: "Proves student identity"

  - id: student_global_state
    type: script
    validator: "global-state-v2"
    description: "Student's global state UTxO (spent to update credential)"
    value:
      - "lovelace"
      - "1 policies.index-policy::g<student_alias>"
    redeemer:
      format: "constructor 1"
      description: "Update global state with credential"
      fields:
        course_id: "23a6bbce3a8deca8985764e847594f6956c9dc643e3f6c8efdba04e4"
        index: 0
        empty_bytes: ""
        course_state_policy: "91e18edd20667deaa1e40e0891b99f2b18ec4d6823d553abecc5ef18"
        credential_hash: "493dcbcf1f5e3bbf5d0ae283f8da5f8e1d3c0c4845ad45ca3edc6885a7f85ca1"
    notes: "Global state updated to store credential proof"

  - id: student_wallet
    type: wallet
    label: "student-wallet"
    description: "Student's wallet UTxO for fees"

reference_inputs:
  - id: script_ref
    description: "Script reference"
    tx_id: "1937336fdedcd62c377c898494e98bec611b5673c7621aad6e8a79e536b9609a"
    index: 1

  - id: module_ref
    description: "Module reference for SLT validation"
    tx_id: "d444817dee91de3f0836d304b2ba576b751fa8400244258be82efc1c1633f733"
    index: 2
    notes: "Validates completed SLTs against module requirements"

outputs:
  - id: student_access_token_return
    type: wallet
    label: "student-wallet"
    description: "Return student's access token"
    value:
      - "1172320 lovelace"
      - "1 policies.index-policy::u<student_alias>"

  - id: global_state_updated
    type: script
    validator: "global-state-v2"
    description: "Updated global state with credential hash"
    value:
      - "1560220 lovelace"
      - "1 policies.index-policy::g<student_alias>"
    datum:
      format: "constructor 0"
      fields:
        alias: "6d616e616765725f303031"
        alias_decoded: "manager_001"
        local_state_map:
          - key: "23a6bbce3a8deca8985764e847594f6956c9dc643e3f6c8efdba04e4"
            key_description: "courseId"
            value: "eb6074566e52a89ec35d0136e1d7020ac84f8a84c26b2c0626f8d86a5ae77767"
            value_description: "credential_hash - proves course completion"
    notes: "Map value changes from course_state_token_hash to credential_hash"

  - id: student_change_1
    type: wallet
    label: "student-wallet"
    description: "Change output to student wallet"
    value:
      - "32499766 lovelace"

  - id: student_change_2
    type: wallet
    label: "student-wallet"
    description: "Additional change output to student wallet"
    value:
      - "26313915 lovelace"

mints:
  - id: burn_course_state_token
    policy: "policies.course-state-policy"
    policy_id: "91e18edd20667deaa1e40e0891b99f2b18ec4d6823d553abecc5ef18"
    redeemer:
      format: "constructor 4"
      description: "Burn for credential claim"
      fields:
        alias: "6d616e616765725f303031"
        alias_decoded: "manager_001"
        completed_slts:
          - "8dcbe1b925d87e6c547bbd8071c23a712db4c32751454b0948f8c846e9246b5c"
    tokens:
      - "-1 policies.course-state-policy::<student_alias>"
    notes: "BURN course state token - negative quantity"

fees:
  transaction_fee: "346896"
  collateral: "520344"
  service_fee: null
  minUtxo_refund: "~1380000"
  wallet_delta: "-1030000"
  wallet_delta_note: "NEGATIVE = student gains ~1.03 ADA"
  notes: "Student GAINS lovelace - burned course state UTxO releases ~1.38 ADA locked at enrollment, minus ~0.35 tx fee"

observations:
  - "BURNS course state token - credential claim destroys the enrollment token"
  - "Global state datum value changes from course_state_token_hash to credential_hash"
  - "Course state redeemer constructor 3 = burn/claim action"
  - "Mint redeemer constructor 4 = burn with credential proof (alias + completed SLTs)"
  - "Global state redeemer constructor 1 = update with credential data"
  - "Student receives NET GAIN in lovelace (burned UTxO releases ~1.38 ADA, minus ~0.35 fee)"
  - "No service fee charged for credential claim"
  - "Credential hash stored permanently in global state - proves course completion"
  - "Completed SLTs list in mint redeemer allows on-chain verification of achievements"

questions:
  - "How is the credential_hash computed? Hash of completed SLTs + courseId?"
  - "Can credential be claimed with partial completion, or must all required SLTs be done?"
  - "Is the credential_hash verifiable off-chain from the global state datum?"
