# V2 Transaction: Course Student Credential Claim
# Source: Decoded from CBOR transaction
# API: POST /v2/tx/course/student/credential/claim

name: CourseStudentCredentialClaimV2
id: course.student.credential.claim

metadata:
  role: "student"
  system: "course"
  description: "Claim course credential by burning course state and storing credential hash in global state"
  api_endpoint: "/v2/tx/course/student/credential/claim"

request_body:
  description: "ClaimCourseCredentialTxRequest"
  fields:
    alias:
      type: string
      required: true
      description: "Student's access token alias"
      example: "student_001"
    course_id:
      type: string
      required: true
      description: "Course NFT policy ID (56 char hex)"
      example: "7ab75aa33060796d464762a3a81f6332b54592f03ed623d6f2c32841"

response:
  description: "UnsignedTxResponse"
  fields:
    unsigned_tx:
      type: string
      description: "CBOR-encoded unsigned transaction"

costs:
  txFee: 341594
  protocolFee: 0
  protocolFeeDestination: null
  minUtxo:
    user-token-output: 1172320
    global-state-output: 1560220
  executionUnits:
    spend_0_course_state:
      mem: 105797
      steps: 35442952
    spend_2_global_state:
      mem: 213583
      steps: 73472687
    mint_0_course_state_burn:
      mem: 154792
      steps: 51735606
  note: "No protocol fee. Three execution units: course-state spend, global-state spend, course-state-policy burn."

inputs:
  - id: course-state-input
    type: script
    validator: course-state-validator
    address: "addr_test1xr07w3s4gz623hfwwesh5n2lp2r2eqc0qa2llf25zgngn6je040rfxn88d94ckqzkq2h7lcmqzq995dxnqe8kl97w0lq95w7js"
    value:
      - "lovelace"
      - "1 course-state-policy.{alias}"
    datum:
      type: inline
      format: "constructor 0"
      description: "Student's completed course state (no active commitment)"
      fields:
        - name: "completed_modules"
          type: "list"
          description: "List of completed module hashes (slt_hashes)"
    redeemer:
      tag: "Spend"
      index: 0
      format: "constructor 3"
      fields: []
      description: "Claim action - empty fields"
      example:
        constructor: 3
        fields: []
    description: "Student's course state UTxO - spent and token burned"

  - id: global-state-input
    type: script
    validator: global-state-v2
    address: "addr_test1xr2ujzcqsq0pwfua3qnjxy4444kw5dng593gn7e4jflyaauju93gql04ja36fs0af42vadhn8jhre6u2pm2vjltgyfsq764wdy"
    value:
      - "lovelace"
      - "1 index-policy.g{alias}"
    datum:
      type: inline
      description: "Current global state with enrollment hash in local_state_information"
    redeemer:
      tag: "Spend"
      index: 2
      format: "constructor 1"
      fields:
        - name: "course_id"
          type: "bytes"
          description: "Course NFT policy ID"
        - name: "flag"
          type: "int"
          value: 0
          description: "Flag value (0 for credential claim)"
        - name: "empty"
          type: "bytes"
          value: ""
        - name: "course_state_policy"
          type: "bytes"
          description: "Course state minting policy ID"
        - name: "credential_hash"
          type: "bytes"
          description: "Computed credential hash to store"
      example:
        constructor: 1
        fields:
          - "7ab75aa33060796d464762a3a81f6332b54592f03ed623d6f2c32841"
          - 0
          - ""
          - "dfe7461540b4a8dd2e76617a4d5f0a86ac830f0755ffa554122689ea"
          - "b5f5a2a2c5e5328d02f33a45d5bf03afbd0f8aa488b900bf3a4d7074fe92e646"
    description: "Student's global state UTxO - spent to update credential hash"

  - id: wallet-inputs
    type: wallet
    address: "{user_wallet}"
    description: "User's wallet providing ADA for fees"

  - id: access-token-utxo
    type: wallet
    address: "{user_wallet}"
    value:
      - "1 index-policy.u{alias}"
    description: "Student's access token UTxO - proves identity"

reference_inputs:
  - id: script-ref-0
    utxo: "7c5f522d87d340be46ad970a7956fdb984d5682dcbea92887cf4fd46bae7d40b#2"
    description: "Script reference for global-state-v2"

  - id: script-ref-1
    utxo: "957a855b5ae7fefe3d13c051f2f3234674c765c7cf986244ae5a2a5960d59fd4#1"
    description: "Script reference for course-state-policy"

outputs:
  - id: user-token-return
    type: wallet
    address: "{user_wallet}"
    value:
      - "~1172320 lovelace"
      - "1 index-policy.u{alias}"
    description: "Student's access token returned to wallet"

  - id: global-state-output
    type: script
    validator: global-state-v2
    address: "addr_test1xr2ujzcqsq0pwfua3qnjxy4444kw5dng593gn7e4jflyaauju93gql04ja36fs0af42vadhn8jhre6u2pm2vjltgyfsq764wdy"
    value:
      - "~1560220 lovelace"
      - "1 index-policy.g{alias}"
    datum:
      type: inline
      format: "constructor 0"
      fields:
        - name: "alias"
          type: "bytes"
          description: "Student's alias"
        - name: "local_state_information"
          type: "map"
          description: "Map of course_id -> credential_hash (updated from enrollment_hash)"
      example:
        constructor: 0
        fields:
          - "73747564656e745f303031"
          - {"7ab75aa33060796d464762a3a81f6332b54592f03ed623d6f2c32841": "ff25b06a39f5a4e56433a4d0c5258cd32ee744172300221beccf48bae8ebe49f"}
    description: "Global state recreated with credential hash replacing enrollment hash"

  - id: change
    type: wallet
    address: "{user_wallet}"
    value:
      - "remaining lovelace"
    description: "Change returned to user wallet (may include lovelace freed from burned course-state UTxO)"

mints:
  - id: course-state-burn
    policy: course-state-policy
    policyId: "{parameterized per course}"
    policyIdExample: "dfe7461540b4a8dd2e76617a4d5f0a86ac830f0755ffa554122689ea"
    redeemer:
      tag: "Mint"
      index: 0
      format: "constructor 4"
      fields:
        - name: "alias"
          type: "bytes"
          description: "Student's alias"
        - name: "completed_modules"
          type: "list"
          description: "List of completed module hashes (for verification)"
      example:
        constructor: 4
        fields:
          - "73747564656e745f303031"
          - ["356be366236f712c2397b3c151ae8ed4656e2574aabfb637ef44ae8345ce9b9a"]
    tokens:
      - quantity: -1
        name: "{alias}"
        description: "Course state token BURNED - ends enrollment"
    description: "Burns the course-state token to claim credential"

withdraws: null

design_notes:
  burn_not_mint: |
    Unlike what the term "claim credential" might suggest, this transaction does NOT mint
    a credential token. Instead, it:
    1. Burns the course-state token (ending the enrollment)
    2. Updates the global state's local_state_information map

  credential_hash_storage: |
    The credential is proven by the hash stored in the global state datum.
    Before claim: local_state_information[course_id] = enrollment_hash
    After claim:  local_state_information[course_id] = credential_hash

    The credential_hash is derived from the completed module hashes.

  three_execution_units: |
    This transaction has three script executions:
    1. course-state-validator spend (constructor 3 = Claim)
    2. global-state-v2 spend (constructor 1 with credential data)
    3. course-state-policy mint/burn (constructor 4 = Burn)

  redeemer_constructors: |
    Course-state spend: Constructor 3 (Claim) - empty fields
    Global-state spend: Constructor 1 with (course_id, flag=0, "", course_state_policy, credential_hash)
    Course-state-policy burn: Constructor 4 with (alias, completed_modules list)

  lovelace_freed: |
    When the course-state UTxO is burned, its lovelace (~1.4 ADA) is returned to the student.
    This partially offsets the transaction fee.

  no_protocol_fee: |
    Credential claims have no protocol fee. Students only pay network transaction fees.

  global_state_flag_values: |
    In the global-state redeemer:
    - flag = -1: Enrollment (adding course to local_state_information)
    - flag = 0:  Credential claim (updating enrollment_hash to credential_hash)

registry:
  validators:
    course-state-validator:
      address: "addr_test1xr07w3s4gz623hfwwesh5n2lp2r2eqc0qa2llf25zgngn6je040rfxn88d94ckqzkq2h7lcmqzq995dxnqe8kl97w0lq95w7js"
      note: "Redeemer constructor 3 = Claim action"
    global-state-v2:
      address: "addr_test1xr2ujzcqsq0pwfua3qnjxy4444kw5dng593gn7e4jflyaauju93gql04ja36fs0af42vadhn8jhre6u2pm2vjltgyfsq764wdy"
      note: "Redeemer constructor 1 with flag=0 for credential claim"
  policies:
    course-state-policy:
      policyId: "{parameterized per course}"
      example: "dfe7461540b4a8dd2e76617a4d5f0a86ac830f0755ffa554122689ea"
      note: "Redeemer constructor 4 = Burn action with completed_modules verification"
