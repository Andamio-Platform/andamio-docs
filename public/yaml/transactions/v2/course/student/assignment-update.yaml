# Token references use dot notation to map to address-registry.json
# Format: <category>.<name> maps to registry path

name: "Update Assignment Submission"
id: "course.student.assignment-update"

metadata:
  role: "student"
  system: "course"
  description: "Student updates their assignment submission with new info while keeping the same SLT hash"
  api_endpoint: "/tx/v2/student/course/assignment/update"

# Example: Student updating assignment info (SLT hash unchanged)
example_context:
  student_alias: "manager_001"
  course_id: "23a6bbce3a8deca8985764e847594f6956c9dc643e3f6c8efdba04e4"
  slt_hash: "8dcbe1b925d87e6c547bbd8071c23a712db4c32751454b0948f8c846e9246b5c"
  assignment_info: "some updated assignment info"

inputs:
  - id: student_access_token
    type: wallet
    label: "student-wallet"
    description: "Student's access token UTxO"
    value:
      - "~1172320 lovelace"
      - "1 policies.index-policy::u<student_alias>"
    notes: "Proves student identity - hex 756d616e616765725f303031 = 'umanager_001'"

  - id: student_course_state
    type: script
    validator: "course-state-validator"
    description: "Student's course state UTxO (spent to update assignment)"
    value:
      - "lovelace"
      - "1 policies.course-state-policy::<student_alias>"
    datum:
      format: "constructor 1"
      description: "Pending assignment state"
      fields:
        slt_hash: "<slt_hash>"
        assignment_info: "<old_assignment_info>"
        additional: "[]"
    redeemer:
      format: "constructor 1"
      description: "Update assignment action"
      fields:
        nested:
          format: "constructor 0"
          fields:
            slt_hash: "<slt_hash>"
            assignment_info: "<new_assignment_info>"
    notes: "Redeemer constructor 1 with nested constructor 0 for update action"

  - id: student_wallet
    type: wallet
    label: "student-wallet"
    description: "Student's wallet UTxO for fees"

reference_inputs:
  - id: module_ref
    description: "Module reference for SLT validation"
    tx_id: "d444817dee91de3f0836d304b2ba576b751fa8400244258be82efc1c1633f733"
    index: 2
    notes: "Contains module token with SLT hash for validation"

outputs:
  - id: student_access_token_return
    type: wallet
    label: "student-wallet"
    description: "Return student's access token"
    value:
      - "1172320 lovelace"
      - "1 policies.index-policy::u<student_alias>"

  - id: course_state_updated
    type: script
    validator: "course-state-validator"
    description: "Updated student course state with new assignment info"
    value:
      - "1504190 lovelace"
      - "1 policies.course-state-policy::<student_alias>"
    datum:
      format: "constructor 1"
      description: "Pending assignment state (unchanged SLT, updated info)"
      fields:
        slt_hash: "8dcbe1b925d87e6c547bbd8071c23a712db4c32751454b0948f8c846e9246b5c"
        assignment_info: "736f6d6520757064617465642061737369676e6d656e7420696e666f"
        assignment_info_decoded: "some updated assignment info"
        additional: "[]"
    notes: "SLT hash unchanged, assignment_info updated"

  - id: student_change_1
    type: wallet
    label: "student-wallet"
    description: "Change output to student wallet"
    value:
      - "24159379 lovelace"

  - id: student_change_2
    type: wallet
    label: "student-wallet"
    description: "Additional change output to student wallet"
    value:
      - "20765475 lovelace"

# No minting - spend and recreate pattern
mints: null

fees:
  transaction_fee: "277568"
  collateral: "416352"
  service_fee: null
  minUtxo_delta: "~52432"
  wallet_delta: "~330000"
  notes: "Total wallet cost ~0.33 ADA = 0.28 ADA tx fee + ~0.05 ADA minUTxO increase (larger datum)"

observations:
  - "NO MINTING - this is a spend-and-recreate pattern like assignments-assess"
  - "SLT hash UNCHANGED between input and output datum"
  - "Only the assignment_info field is updated"
  - "Datum stays as constructor 1 (pending assignment state)"
  - "Redeemer is constructor 1 (update) with nested constructor 0 containing new data"
  - "Different from new assignment commit which would use different redeemer"
  - "No service fee charged for assignment updates"
  - "Student must own the course state token being updated"
  - "MinUTxO increases when datum grows (longer assignment_info = more lovelace locked)"

questions:
  - "Can student update to a different SLT hash, or must it stay the same?"
  - "What's the difference between assignment-update and submitting a new assignment?"
  - "Is there a limit to how many times an assignment can be updated?"
