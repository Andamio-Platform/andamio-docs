# Source: Decoded from CBOR transaction

name: ManageCourseGovernanceV2
id: admin.course-teachers-update

metadata:
  role: "admin"
  system: "course"
  description: "Admin updates the teacher list for a course (add/remove teachers)"
  api_endpoint: "/tx/v2/admin/course/teachers/update"

# ==============================================================================
# COSTS (observed from CBOR)
# ==============================================================================
costs:
  txFee: 305733               # ~0.31 ADA - lower than course-create (no minting)
  protocolFee: 5000000        # 5 ADA (same instance treasury)
  minUtxo:
    local_state_nft: 1236970     # ~1.24 ADA (unchanged from course-create)
    course_governance: 1357650   # ~1.36 ADA (slightly higher - more teachers in datum)
