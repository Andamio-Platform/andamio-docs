  # Reusing same reference tx we've seen before
  - id: ref_0
    utxo: "35d93ccfe17ccd6de427c66818f19eb79d729b7abd825be02441a70dfd769aff#3"
    description: "Script reference - index 3 (new index, same tx)"

  - id: ref_1
