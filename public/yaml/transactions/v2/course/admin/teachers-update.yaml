# ==============================================================================
# INPUTS (4 total)
# ==============================================================================
inputs:
  # INPUT - Admin's access token (wallet, not spent by script)
  - id: admin_access_token
    type: wallet
    description: "Admin wallet with user access token (ujames)"

  # INPUT - LocalStateNFT (spent with courseId redeemer)
  - id: local_state_nft_input
    type: script
    validator: local-state-nft-validator
    address: "addr_test1xzlrs55we4u7speyteuqdnw7tl7u4npzm9p2j5l9lgfu32uey3l3jfdh9fjp5r36meser0d70vlrls0agh62ur622jmqtucd7n"
    redeemer:
      data: "bytes (courseId)"
    description: "Course's LocalStateNFT - consumed and recreated"

  # INPUT - Course governance UTxO (spent with courseId redeemer)
  - id: course_governance_input
    type: script
    validator: course-governance-validator
    address: "addr_test1xpswwtj7upt9gh7txled87dc20dwmc6k294ttjq03p4x225ey3l3jfdh9fjp5r36meser0d70vlrls0agh62ur622jmqtt05jv"
    redeemer:
      data: "bytes (courseId)"
    description: "Course governance - consumed to update teacher list"

  # INPUT - Admin wallet for fees
  - id: admin_wallet
    type: wallet
    description: "Admin wallet UTxOs for fees"

# ==============================================================================
# REFERENCE INPUTS (2 total)
# ==============================================================================
