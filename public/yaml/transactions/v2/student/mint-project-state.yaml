# Token references use dot notation to map to validator-registry-v1.yaml
# Format: <system>.<token-name> maps to registry path: systems > <system> > tokens > <token-name>

name: StudentMintCourseStateV2Transaction
id: course.mint-course-state

# Metadata about this transaction type
metadata:
  role: "student"
  category: "state_management"
  requires_tokens: ["global-state.access-token-user", "global-state.access-token-global-state"]
  estimated_cost: "0 ADA"
  description: "Student mints local state token for course v2 participation"
  multi_signature: false

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: 
        - "1 global-state.access-token-user"

  - id: global_state_v2_1
    type: script
    redeemer: 
      nft: "<course_nft_policyid>"
      data_index: 1
      state_data_hash: "100 + 200"
      policy_id: "<course_state_v2_policyid>"
    output:
      address: "global-state.global-state-v2"
      value: 
        - "1 global-state.access-token-global-state"
      datum:
        alias: "<alias>"
        local_states:
          - nft: "<project_nft_policyid>"
            data_hash: "<project_hash_2> + <project_hash_3> + ''"

          - nft: "<course_nft_policyid>"
            data_hash: "100 + 200 + ''"

# reference inputs
reference_inputs:
  - id: local_state_registration_1
    type: script
    output:
      address: "global.local-state-registration"
      value: 
        - "1 global.local-state-registration"
      datum: "course.course-nft-policy"
      script: "course_state_v2"

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: 
        - "1 global-state.access-token-user"

  - id: global_state_v2_1
    type: script
    output:
      address: "global-state.global-state-v2"
      value:
        - "1 global-state.access-token-global-state"
      datum:
        alias: "<alias>"
        local_states:
          - nft: "<course_nft_policyid>"
            data_hash: "100 + 200 + ''"

          - nft: "<project_nft_policyid>"
            data_hash: "<project_hash_2> + <project_hash_3> + ''"

  - id: course_state_v2_1
    type: script
    output:
      address: "course.course-state-v2-scripts"
      value: 
        - "1 course.course-state-v2-token"
      datum: 
        state: ["100", "200"]

mints:
  - id: course_state_v2
    policy: "<course_state_v2_policyid>"
    redeemer:
      string: "<alias>"
      current_state: ["100", "200"]

    tokens:
      - "1 course.course-state-v2-token"