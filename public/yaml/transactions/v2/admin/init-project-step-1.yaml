# Token references use dot notation to map to validator-registry-v1.yaml
# Format: <system>.<token-name> maps to registry path: systems > <system> > tokens > <token-name>

name: AdminInitProjectV2Step1Transaction
id: admin.init-project-v2-step-1

# Metadata about this transaction type
metadata:
  role: "admin"
  category: "instance_management"
  requires_tokens: ["instance.instance-admin-token"]
  estimated_cost: "0 ADA"
  description: "Instance admin initializes a new project (step 1 of 2)"
  multi_signature: true
  required_signatures: ["instanceAdmin"]

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: instance_admin
    type: wallet
    output:
      address: "instance admin wallet"
      value: 
        - "1 instance.instance-admin-token"

# reference inputs
reference_inputs:
  - id: instance_provider_1
    type: script
    output:
      address: "instance.instance-provider-scripts"
      value: 
        - "1 instance.project-nft"
      datum: ["nft_logic1", "nft_logic2", "nft_logic3"]

  - id: instance_provider_2
    type: script
    output:
      address: "instance.instance-provider-scripts"
      value: 
        - "1 instance.contributor-state-v2-scripts"
      datum: ["contributor_state_v2_logic1", "contributor_state_v2_logic2", "contributor_state_v2_logic3"]
      script: "contributor_state_v2_obs"

# outputs
outputs:
  - id: instance_admin
    type: wallet
    output:
      address: "instance admin wallet"
      value: 
        - "1 instance.instance-admin-token"

  - id: instance_governance_1
    type: script
    output:
      address: "instance.instance-governance-scripts"
      value: 
        - "1 project.project-nft"
      datum:
        creators: ["<creator_alias_a>", "<creator_alias_b>"]
        policy_id: "project.project-nft-policy"

  - id: local_state_registration_1
    type: script
    output:
      address: "global.local-state-registration"
      value: 
        - "1 global.local-state-registration"
      datum: "project.project-nft-policy"
      script: "contributor_state_v2_logic1 + project.project-nft + contributor_state_v2_logic2 + [(project.project-nft-policy, [ls_data])] + contributor_state_v2_logic3"

# minting
mints:
  - id: project_nft
    policy: "<project_nft_policyid>"
    redeemer: "()"
    tokens:
      - '1 project.project-nft'

  - id: global.local-state-registration
    policy: "<local-state-registration>"
    redeemer:
      - policy_id: "<project_nft_policyid>"
      - policy_id: "<contributor_state_v2_policyid>"
    tokens:
      - "1 global.local-state-registration"

# withdrawing
withdraws:
  - id: contributor_state_v2_obs
    observer: "project.contributor-state-v2-cbor-obs"
    redeemer:
      tx_id: "string"
      tx_ix: "string"
      prerequisite: "[(project.project-nft-policy, [ls_data])]"
    amount: 0
