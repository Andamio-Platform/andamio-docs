# Token references use dot notation to map to validator-registry-v1.yaml
# Format: <system>.<token-name> maps to registry path: systems > <system> > tokens > <token-name>

name: ContributorMintContributorStateV2Transaction
id: contributor.mint-project-state

# Metadata about this transaction type
metadata:
  role: "contributor"
  category: "project"
  requires_tokens: ["global-state.access-token-user", "global-state.access-token-global-state"]
  estimated_cost: "0 ADA"
  description: "Contributor mints project state token to join project"
  multi_signature: false

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: 
        - "1 global-state.access-token-user"

  - id: global_state_v2_1
    type: script
    redeemer: 
      nft: "<project_nft_policyid>"
      data_index: 0
      state_data_hash: "<project_hash_2> + <project_hash_3>"
      policy_id: "<contributor_state_v2_policyid>"
    output:
      address: "global-state.global-state-v2"
      value: 
        - "1 global-state.access-token-global-state"
      datum:
        alias: "<alias>"
        local_states:
          - nft: "<project_nft_policyid>"
            data_hash: "<project_hash_2> + <project_hash_3> + ''"

          - nft: "<course_nft_policyid>"
            data_hash: "100 + 200 + ''"

# reference inputs
reference_inputs:
  - id: local_state_registration_1
    type: script
    output:
      address: "global.local-state-registration"
      value: 
        - "1 global.local-state-registration"
      datum: "project.project-nft-policy"
      script: "contributor_state_v2"

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: 
        - "1 global-state.access-token-user"

  - id: global_state_v2_1
    type: script
    output:
      address: "global-state.global-state-v2"
      value:
        - "1 global-state.access-token-global-state"
      datum:
        alias: "<alias>"
        local_states:
          - nft: "<project_nft_policyid>"
            data_hash: "<project_hash_2> + <project_hash_3> + contributor_state_v2_policyid"

          - nft: "<course_nft_policyid>"
            data_hash: "100 + 200 + ''"

  - id: contributor_state_v2_1
    type: script
    output:
      address: "project.contributor-state-v2-scripts"
      value: 
        - "2 project.contributor-state-v2-token"
      datum: 
        project_list: ["<project_hash_2>", "<project_hash_3>"]

mints:
  - id: contributor_state_v2
    policy: "<contributor_state_v2_policyid>"
    redeemer:
      string: "<alias>"
      current_state: ["<project_hash_2>", "<project_hash_3>"]
      prerequisites_state:
        - nft: "<course_nft_policyid>"
          state: ["100", "200"]
          policy: ""
      prerequisites_clear:
        - nft: "<course_nft_policyid>"
          data: ["100"] 
    tokens:
      - "2 project.contributor-state-v2-token"