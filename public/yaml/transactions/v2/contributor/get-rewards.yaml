# Token references use dot notation to map to validator-registry-v1.yaml
# Format: <system>.<token-name> maps to registry path: systems > <system> > tokens > <token-name>

name: ContributorGetRewardsTransaction
id: contributor.get-rewards

# Metadata about this transaction type
metadata:
  role: "contributor"
  category: "project"
  requires_tokens: ["global-state.access-token-user", "project.contributor-state-v2-token"]
  estimated_cost: "0 ADA"
  description: "Contributor claims rewards for completed project work"
  multi_signature: false

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: 
        - "1 global-state.access-token-user"
  - id: contributor_state_v2_1
    type: script
    redeemer:
      alias: "<alias>"
      project_hash: "<project_hash_1>"
    output:
      address: "project.contributor-state-v2-scripts"
      value: 
        - "1 project.contributor-state-v2-token"
      datum: 
        project_list: ["<project_hash_2>", "<project_hash_3>"]

  - id: contributor_state_v2_2
    type: script
    redeemer:
      alias: "<alias>"
    output:
      address: "project.contributor-state-v2-scripts"
      value: 
        - "<reward_lovelace_amount> lovelace"
        - "1 project.contributor-state-v2-token"
      datum: 
        project_hash: "<project_hash_1>"

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: 
        - "<reward_lovelace_amount> lovelace"
        - "1 global-state.access-token-user"

  - id: contributor_state_v2_1
    type: script
    output:
      address: "project.contributor-state-v2-scripts"
      value: 
        - "2 project.contributor-state-v2-token"
      datum: 
        project_list: ["<project_hash_1>", "<project_hash_2>", "<project_hash_3>"]