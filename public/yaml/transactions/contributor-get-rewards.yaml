name: ContributorGetRewardsTransaction

# Metadata about this transaction type
metadata:
  role: "Contributor"
  category: "reward_management"
  requires_tokens: ["100at", "contributorNFT", "projectCompletionToken"]
  estimated_fee: "2.5 ADA"
  description: "Contributor claims rewards for completed project work"
  multi_signature: false

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: ["1 index.222bob"]

  - id: contributor_state_1
    type: script
    redeemer:
      alias: "bob"
      string: "project hash 1"
    output:
      address: "contributor_state"
      value: ["1 contributor_state.bob"]
      datum: 
        string: ["project hash 2", "project hash 3"]

  - id: contributor_state_2
    type: script
    redeemer:
      alias: "bob"
    output:
      address: "contributor_state"
      value: ["10000000 lovelace", "1 contributor_state.bob"]
      datum: 
        string: "project hash 1"

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: ["10000000 lovelace", "1 index.222bob"]

  - id: contributor_state_1
    type: script
    output:
      address: "contributor_state"
      value: ["2 contributor_state.bob"]
      datum: 
        string: ["project hash 1", "project hash 2", "project hash 3"]