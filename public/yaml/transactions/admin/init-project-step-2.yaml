# Token references use dot notation to map to validator-registry-v1.yaml
# Format: <system>.<token-name> maps to registry path: systems > <system> > tokens > <token-name>

# Next step - check against https://cardanoscan.io/transaction/40f65583b2687c4b54fd2763c5133787f4b43add689e3c67f89e22bc73579645?tab=tokenmint

name: AdminInitProjectStep2Transaction
id: admin.init-project-step-2

# Metadata about this transaction type
metadata:
  role: "admin"
  category: "instance_management"
  requires_tokens: ["instance.instance-admin-token"]
  estimated_cost: "0 ADA"
  description: "Instance admin completes project initialization (step 2 of 2)"
  multi_signature: true
  required_signatures: ["instanceAdmin", "globalAdmin"]

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: instance_admin
    type: wallet
    output:
      address: "instance admin wallet"
      value: 
        - "1 instance.instance-admin-token"

# reference inputs
reference_inputs:
  - id: instance_provider_1
    type: script
    output:
      address: "instance.instance-provider-scripts"
      value: 
        - "1 instance.project-nft"
      datum: ["nft_logic1", "nft_logic2", "nft_logic3"]

  - id: instance_provider_2
    type: script
    output:
      address: "instance.instance-provider-scripts"
      value: 
        - "1 instance.treasury-token"
      datum: ["treasury_token_logic1", "treasury_token_logic2"]
      script: "treasury_token_obs"

  - id: instance_provider_3
    type: script
    output:
      address: "instance.instance-provider-scripts"
      value: 
        - "1 instance.treasury-scripts"
      datum: ["treasury_scripts_logic1", "treasury_scripts_logic2", "treasury_scripts_logic3"]
      script: "treasury_scripts_obs"

  - id: instance_provider_4
    type: script
    output:
      address: "instance.instance-provider-scripts"
      value: 
        - "1 instance.contributor-state-scripts"
      datum: ["course_state_logic1", "course_state_logic2", "course_state_logic3"]
      script: "contributor_state_obs"

  - id: instance_governance_1
    type: script
    output:
      address: "instance.instance-governance-scripts"
      value: 
        - "1 project.project-nft"
      datum:
        creators: ["<creator_alias_a>", "<creator_alias_b>"]
        policy_id: "project.project-nft-policy"

# outputs
outputs:
  - id: instance_admin
    type: wallet
    output:
      address: "instance admin wallet"
      value: 
        - "1 instance.instance-admin-token"

  - id: instance_1
    type: script
    output:
      address: "instance.instance-scripts"
      value: 
        - "1 project.project-instance-treasury-scripts"
      datum: "project.project-nft-policy"
      script: "treasury_scripts_logic1 + project.project-nft-policy + treasury_scripts_logic2 + project.treasury-token-policy + treasury_scripts_logic3"

  - id: instance_2
    type: script
    output:
      address: "instance.instance-scripts"
      value: 
        - "1 project.project-instance-contributor-state-scripts"
      datum: "project.project-nft-policy"
      script: "course_state_logic1 + project.project-nft-policy + course_state_logic2 + [(project.project-nft-policy, [102, 103])] + course_state_logic3"

# minting
mints:
  - id: instance
    policy: "<instance_policyid>"
    redeemer:
      - policy_id: "project.project-nft-policy"
        params: ["project.project-nft-policy", "project.treasury-token-policy"]
        token_name: "TreasuryScripts"
      - policy_id: "project.project-nft-policy"
        params: ["project.project-nft-policy", "[(project.project-nft-policy, [ls_data])]"]
        token_name: "ContributorStateScripts"
    tokens:
      - "1 project.project-instance-treasury-scripts"
      - "1 project.project-instance-contributor-state-scripts"

# withdrawing
withdraws:
  - id: treasury_scripts_obs
    observer: "project.treasury-cbor-obs"
    redeemer:
      tx_id: "string"
      tx_ix: "string"
    amount: 0

  - id: contributor_state_obs
    observer: "project.contributor-state-cbor-obs"
    redeemer:
      tx_id: "string"
      tx_ix: "string"
    amount: 0