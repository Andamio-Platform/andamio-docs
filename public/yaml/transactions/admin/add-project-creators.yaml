# Token references use dot notation to map to validator-registry-v1.yaml
# Format: <system>.<token-name> maps to registry path: systems > <system> > tokens > <token-name>

name: AdminAddProjectCreatorsTransaction
id: admin.add-project-creators

# Metadata about this transaction type
metadata:
  role: "admin"
  category: "access_management"
  requires_tokens: ["project.project-nft", "instance.instance-admin-token"]
  estimated_cost: "0 ADA"
  description: "Instance admin adds new project creators to the platform"
  multi_signature: true
  required_signatures: ["instanceAdmin", "globalAdmin"]

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: instance_governance_1
    type: script
    redeemer: ["<alias_to_add>"]
    output:
      address: "instance.instance-governance-scripts"
      value: 
        - "1 project.project-nft"
      datum:
        creators: ["<current_creator_1>", "<current_creator_2>"]
        policy_id: "project.project-nft-policy"

  - id: instance_admin
    type: wallet
    output:
      address: "instance admin wallet"
      value: 
        - "1 instance.instance-admin-token"

# outputs
outputs:
  - id: instance_admin
    type: wallet
    output:
      address: "instance admin wallet"
      value: 
        - "1 instance.instance-admin-token"

  - id: instance_governance_1
    type: script
    output:
      address: "instance.instance-governance-scripts"
      value: 
        - "1 project.project-nft"
      datum:
        creators: ["<alias_to_add>", "<current_creator_1>", "<current_creator_2>"]
        policy_id: "project.project-nft-policy"