# Token references use dot notation to map to validator-registry-v1.yaml
# Format: <system>.<token-name> maps to registry path: systems > <system> > tokens > <token-name>

name: AdminInitCourseTransaction
id: admin.init-course

# Metadata about this transaction type
metadata:
  role: "InstanceAdmin"
  category: "course_management"
  requires_tokens: ["instance.instance-admin-token"]
  estimated_cost: "0 ADA"
  description: "Instance admin initializes a new course in the platform"
  multi_signature: true
  required_signatures: ["instanceAdmin", "globalAdmin"]

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: instance_admin
    type: wallet
    output:
      address: "instance admin wallet"
      value: 
        - "1 instance.instance-admin-token" 

# reference inputs
reference_inputs:
  - id: instance_provider_course_nft
    type: script
    output:
      address: "instance.instance-provider-scripts"
      value: 
        - "1 instance.course-nft"  # Reference token to be placed
      datum: ["nft_logic1", "nft_logic2", "nft_logic3"]

  - id: instance_provider_assignment_validator
    type: script
    output:
      address: "instance.instance-provider-scripts"
      value: 
        - "1 instance.assignment-validator"
      datum: ["assignment_logic1", "assignment_logic2"]
      script: "assignment_obs"

  - id: instance_provider_module_scripts
    type: script
    output:
      address: "instance.instance-provider-scripts"
      value: 
        - "1 instance.module-scripts"
      datum: ["module_logic1", "module_logic2"]
      script: "module_obs"

  - id: instance_provider_course_state_scripts
    type: script
    output:
      address: "instance.instance-provider-scripts"
      value: 
        - "1 instance.course-state-scripts"
      datum: ["course_state_logic1", "course_state_logic2", "course_state_logic3"]
      script: "course_state_obs"

# outputs
outputs:
  - id: instance_admin
    type: wallet
    output:
      address: "instance admin wallet"
      value: 
        - "1 instance.instance-admin-token"

  - id: instance_governance_1
    type: script
    output:
      address: "instance.instance-governance-scripts"
      value: 
        - "1 course.course-nft"
      datum:
        creators: ["<creator_alias_a>", "<creator_alias_b>"]
        policy_id: "course.course-state-policy"

  - id: instance_assignment_validator
    type: script
    output:
      address: "instance.instance-scripts"
      value: 
        - "1 course.instance-assignment-validator"
      datum: "course.course-state-policy"
      script: "assignment_logic1 + course.course-state-policy + assignment_logic2"

  - id: instance_module_scripts
    type: script
    output:
      address: "instance.instance-scripts"
      value: 
        - "1 course.instance-module-scripts"
      datum: "course.course-state-policy"
      script: "module_logic1 + course.course-state-policy + module_logic2"

  - id: instance_course_state_scripts
    type: script
    output:
      address: "instance.instance-scripts"
      value: 
        - "1 course.instance-course-state-scripts"
      datum: "course.course-state-policy"
      script: "course_state_logic1 + course.course-state-policy + course_state_logic2 + course.module-policy + course_state_logic3"

# minting
mints:
  - id: course-nft
    policy: "<course_nft_policyid>"
    redeemer: "()"
    tokens:
      - '1 course.course-nft'
  
  - id: instance
    policy: "<instance_policyid>"
    redeemer:
      - policy_id: "<course_state_policyid>"
        params: ["course.course-state-policy"]
        token_name: "AssignmentValidator"
      - policy_id: "<course_state_policyid>"
        params: ["course.course-state-policy"]
        token_name: "ModuleScripts"
      - policy_id: "<course_state_policyid>"
        params: ["course.course-state-policy", "course.module-policy"]
        token_name: "CourseStateScripts"
    tokens:
      - "1 course.instance-assignment-validator"
      - "1 course.instance-module-scripts"
      - "1 course.instance-course-state-scripts"

# withdrawing
withdraws:
  - id: assignment-cbor-obs
    observer: "course.assignment-cbor-obs"
    redeemer:
      tx_id: "string"
      tx_ix: "string"
    amount: 0

  - id: module-cbor-obs
    observer: "course.module-cbor-obs"
    redeemer:
      tx_id: "string"
      tx_ix: "string"
    amount: 0

  - id: course-state-cbor-obs
    observer: "course.course-state-cbor-obs"
    redeemer:
      tx_id: "string"
      tx_ix: "string"
    amount: 0