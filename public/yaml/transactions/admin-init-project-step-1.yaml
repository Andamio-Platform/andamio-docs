name: AdminInitProjectStep1Transaction
id: admin-init-project-step-1

# Metadata about this transaction type
metadata:
  role: "InstanceAdmin"
  category: "instance_management"
  requires_tokens: ["instanceAdminNFT"]
  estimated_fee: "3.5 ADA"
  description: "Instance admin initializes a new project (step 1 of 2)"
  multi_signature: true
  required_signatures: ["instanceAdmin", "globalAdmin"]

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: instance_admin
    type: wallet
    output:
      address: "instance admin wallet"
      value: ["1 nft.InstanceAdmin"]

# reference inputs
reference_inputs:
  - id: instance_provider_1
    type: script
    output:
      address: "instance_provider"
      value: ["1 instance_provider.ProjectNFT"]
      datum: ["nft_logic1", "nft_logic2", "nft_logic3"]

  - id: instance_provider_2
    type: script
    output:
      address: "instance_provider"
      value: ["1 instance_provider.TreasuryToken"]
      datum: ["treasury_token_logic1", "treasury_token_logic2"]
      script: "treasury_token_obs"

  - id: instance_provider_3
    type: script
    output:
      address: "instance_provider"
      value: ["1 instance_provider.Escrow1"]
      datum: ["escrow_logic1", "escrow_logic2"]
      script: "escrow_obs"

# outputs
outputs:
  - id: instance_governance_1
    type: script
    output:
      address: "instance governance"
      value: ["1 nft.ProjectNFT"]
      datum:
        creators: ["bob", "carol"]
        policy_id: "nft"

  - id: instance_1
    type: script
    output:
      address: "instance"
      value: ["1 instance_provider.TreasuryToken"]
      datum: "nft"
      script: "treasury_token_logic1 + nft + treasury_token_logic2"

  - id: instance_2
    type: script
    output:
      address: "instance"
      value: ["1 instance_provider.Escrow1"]
      datum: "nft"
      script: "escrow_logic1 + nft + escrow_logic2"

# minting
mints:
  - id: nft
    redeemer: "()"
    tokens: ['1 nft.ProjectNFT']
  
  - id: instance
    redeemer:
      - policy_id: "nft"
        params: ["nft"]
        token_name: "TreasuryToken"
      - policy_id: "nft"
        params: ["nft"]
        token_name: "Escrow1"
    tokens: ["1 instance_provider.TreasuryToken",
             "1 instance_provider.Escrow1"]

# withdrawing
withdraws:
  - id: treasury_token_obs
    redeemer:
      tx_id: "string"
      tx_ix: "string"
    amount: 0

  - id: escrow_obs
    redeemer:
      tx_id: "string"
      tx_ix: "string"
    amount: 0