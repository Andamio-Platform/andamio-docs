# Token references use dot notation to map to validator-registry-v1.yaml
# Format: <system>.<token-name> maps to registry path: systems > <system> > tokens > <token-name>

name: StudentMintLocalStateTransaction
id: student.mint-local-state

# Metadata about this transaction type
metadata:
  role: "Student"
  category: "state_management"
  requires_tokens: ["global-state.access-token-user", "global-state.access-token-global-state"]
  estimated_cost: "0 ADA"
  description: "Student mints local state token for course participation"
  multi_signature: false

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "student"
      value: 
        - "1 global-state.access-token-user"
  - id: global_state_1
    type: script
    redeemer: 
      nft: "policy_id"
      string: ["201", "202", "203"]
      course_state: "policy_id"
    output:
      address: "global-state.global-state"
      value: 
        - "1 global-state.access-token-global-state"
      datum:
        policy_id: "global_state"
        alias: "bob"
        local_state_information:
          - nft: "policy_id"
            string: ["101", "102", "103"]
            bool: false
        info: "()"

# reference inputs
reference_inputs:
  - id: instance_1
    type: script
    output:
      address: "instance.instance-scripts"
      value: 
        - "1 course.instance-course-state-scripts"
      datum: "nft"
      script: "course_state"

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "student"
      value: 
        - "1 global-state.access-token-user"
  - id: global_state_1
    type: script
    output:
      address: "global-state.global-state"
      value: 
        - "1 global-state.access-token-global-state"
      datum:
        policy_id: "global_state"
        alias: "bob"
        local_state_information:
          - nft: "policy_id"
            assignment_list: ["201", "202", "203", "101", "102", "103"]
            bool: false
        info: "()"

  - id: course_state_1
    type: script
    redeemer:
      alias: "bob"
    output:
      address: "course.course-state-validator"
      value: 
        - "1 course.course-state-token"
      datum: 
        assignment_list: ["201", "202", "203"]

mints:
  - id: course_state
    policy: "course.course-state-policy"
    redeemer:
      string: "bob"
    tokens:
      - "1 course.course-state-token"