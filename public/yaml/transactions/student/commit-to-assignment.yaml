# Token references use dot notation to map to validator-registry-v1.yaml
# Format: <system>.<token-name> maps to registry path: systems > <system> > tokens > <token-name>

name: StudentCommitToAssignmentTransaction
id: student.commit-to-assignment

# Metadata about this transaction type
metadata:
  role: "Student"
  category: "assignment_management"
  requires_tokens: ["global-state.access-token-user", "course.course-state-token"]
  estimated_cost: "0 ADA"
  description: "Student commits to working on a specific module assignment"

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "student"
      value: 
        - "1 global-state.access-token-user"
  
  - id: course_state_1
    type: script
    redeemer:
      alias: "bob"
      string: "101"
      maybe_string: "Just some"
    output:
      address: "course.course-state-validator"
      value: 
        - "1 course.course-state-token"
      datum: 
        assignment_list: ["201", "202", "203"]

reference_inputs:
  - id: module_ref_1
    type: script
    output:
      address: "course.module-ref-validator"
      value: 
        - "1 course.module-token"
    datum:
      slts: ["(slt, content)"]
      maybe_assignment:
      string: "assignment data hash"
      address: "assignment"
      policy_id: ["course_state"]
      assignment_list: ["201", "202"]

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "student"
      value: 
        - "1 global-state.access-token-user"
  - id: assignment_1
    type: script
    output:
      address: "course.assignment-validator"
      value: 
        - "1 course.course-state-token"
      datum:
        string: "101"
        maybe_string: "Just some"
        policy_id: "course_state"
        alias: "bob"
        address: "course_state"
        assignment_list: ["201", "202", "203"]