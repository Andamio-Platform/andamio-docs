name: ProjectCreatorManageTreasuryTransaction
id: project-creator-manage-treasury-token

# Metadata about this transaction type
metadata:
  role: "ProjectCreator"
  category: "treasury_management"
  requires_tokens: ["100at", "projectCreatorNFT", "treasuryToken"]
  estimated_fee: "4.5 ADA"
  description: "Project creator manages treasury funds and distribution"
  multi_signature: true
  required_signatures: ["projectCreator", "instanceAdmin"]

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "alice"
      value: ["1 index.222alice"]

  - id: instance_governance_1
    type: script
    redeemer: "alice"
    output:
      address: "instance governance"
      value: ["1 nft.ProjectNFT"]
      datum:
        creators: ["alice"]
        policy_id: "nft"

  - id: treasury_1
    type: script
    redeemer:
      - projects:
        project_data:
          project_data: "content hash1"
          deadline: 16062027
          lovelace_am: 10000000
          flatten_value: []
        int: 3
      - projects:
        project_data:
          project_data: "content hash"
          deadline: 16062025
          lovelace_am: 100000000
          flatten_value: []
        int: 5
      - policy_id: ["contributor_state_new", "contributor_state_new3"]
      - script_hash: "escrow"
    output:
      address: "treasury"
      value: ["1 treasury_token.escrow"]
      datum:
        projects: ["(project hash 1, 1)", "(project hash 2, 10)", "(project hash 3, 9)"]
        policy_id: ["contributor_state", "contributor_state3"]

  - id: treasury_2
    type: script
    redeemer: "CommitFund"
    output:
      address: "treasury"
      value: ["15000000 lovelace"]

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "alice"
      value: ["1 index.222alice"]

  - id: instance_governance_1
    type: script
    output:
      address: "instance governance"
      value: ["1 nft.CourseNFT"]
      datum:
        creators: ["alice"]
        policy_id: "nft"

  - id: treasury_1
    type: script
    output:
      address: "treasury"
      value: ["1 treasury_token.escrow"]
      datum:
        projects: ["(project new hash 1, 3)", "(new project hash 2, 5)"]
        policy_id: ["contributor_state_new", "contributor_state_new3"]

  - id: treasury_2
    type: script
    redeemer: "CommitFund"
    output:
      address: "treasury"
      value: ["10000000 lovelace"]