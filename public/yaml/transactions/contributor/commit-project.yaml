# Token references use dot notation to map to validator-registry-v1.yaml
# Format: <system>.<token-name> maps to registry path: systems > <system> > tokens > <token-name>

name: ContributorCommitProjectTransaction
id: contributor.commit-project

# Metadata about this transaction type
metadata:
  role: "contributor"
  category: "project"
  requires_tokens: ["global-state.access-token-user", "project.contributor-state-token"]
  estimated_cost: "0 ADA"
  description: "Contributor commits to working on a specific project"
  multi_signature: false

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: 
        - "1 global-state.access-token-user"
        - "2000000 lovelace"

  - id: contributor_state_1
    type: script
    redeemer:
      alias: "<alias>"
      script_hash: "<escrow_hash>"
    output:
      address: "project.contributor-state-scripts"
      value: 
        - "2 project.contributor-state-token"
      datum: 
        project_list: ["<project_hash_2>", "<project_hash_3>"]
  
  - id: treasury_1
    type: script
    redeemer:
      policy_id: "<contributor_state_policyid>"
      alias: "<alias>"
      project_data:
        project_data: "<content_hash>"
        deadline: <deadline>
        lovelace_am: <lovelace_amount>
        flatten_value:
      script_hash: "<escrow_hash>"
      maybe_string: "<string>"
    output:
      address: "project.treasury-scripts"
      value: 
        - "1 project.treasury-token"
      datum:
        projects: ["(<project_hash_1>, 1)", "(<project_hash_2>, 10)"]
        policy_id: ["<contributor_state_policyid>", "<contributor_state_policyid_3>"]

  - id: treasury_2
    type: script
    redeemer: "CommitFund"
    output:
      address: "project.treasury-scripts"
      value: 
        - "15000000 lovelace"

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: 
        - "1 global-state.access-token-user"
  - id: contributor_state_1
    type: script
    output:
      address: "project.contributor-state-scripts"
      value: 
        - "1 project.contributor-state-token"
      datum: 
        project_list: ["<project_hash_2>", "<project_hash_3>"]

  - id: treasury_1
    type: script
    output:
      address: "project.treasury-scripts"
      value: 
        - "1 project.treasury-token"
      datum:
        projects: ["(<project_hash_2>, 10)"]
        policy_id: ["<contributor_state_policyid>", "<contributor_state_policyid_3>"]

  - id: treasury_2
    type: script
    output:
      address: "project.treasury-scripts"
      value: 
        - "5000000 lovelace"
  
  - id: escrow_1
    type: script
    output:
      address: "project.escrow1"
      value: 
        - "1 project.contributor-state-token"
        - "<reward_lovelace_amount> + 2000000 lovelace"
      datum:
        project_data:
          project_data: "<content_hash>"
          deadline: <deadline>
          lovelace_am: <lovelace_amount>
          flatten_value:
        script_hash: "<treasury_hash>"
        policy_id: "<contributor_state_policyid>"
        maybe_string: null

validity_range:
  invalid_after: <timestamp>