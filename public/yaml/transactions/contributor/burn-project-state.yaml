# Token references use dot notation to map to validator-registry-v1.yaml
# Format: <system>.<token-name> maps to registry path: systems > <system> > tokens > <token-name>

name: ContributorBurnContributorInfoTransaction
id: contributor.burn-project-state

# Metadata about this transaction type
metadata:
  role: "Contributor"
  category: "project"
  requires_tokens: ["global-state.access-token-user", "global-state.access-token-global-state", "project.contributor-state-token"]
  estimated_cost: "0 ADA"
  description: "Contributor burns their contributor token to leave project and record results in global state"
  multi_signature: false

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: 
        - "1 global-state.access-token-user"
  - id: global_state_1
    type: script
    redeemer: 
      nft: "<project_nft_policyid>"
      project_list: ["<project_hash_1>", "<project_hash_2>", "<project_hash_3>"]
      contributor_state: "<contributor_state_policyid>"
    output:
      address: "global-state.global-state"
      value: 
        - "1 global-state.access-token-global-state"
      datum:
        policy_id: "<access_token_policyid>"
        alias: "<alias>"
        local_state_information:
          - nft: "<project_nft_policyid>"
            project_list: ["<project_hash_1>", "<project_hash_2>", "<project_hash_3>"]
            bool: true

          - contributor_state: "<contributor_state_policyid>"
            project_list: ["<project_hash_1>"]
            bool: true
        info: "<string>"

  - id: contributor_state_1
    type: script
    redeemer:
      string: "<alias>"
    output:
      address: "project.contributor-state-scripts"
      value: 
        - "2 project.contributor-state-token"
      datum: 
        project_list: ["<project_hash_1>", "<project_hash_2>", "<project_hash_3>"]

# reference inputs
reference_inputs:
  - id: instance_1
    type: script
    output:
      address: "instance.instance-scripts"
      value: 
        - "1 project.project-instance-contributor-state-scripts"
      datum: "<project_nft_policyid>"
      script: "contributor_state"

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: 
        - "1 global-state.access-token-user"
  - id: global_state_1
    type: script
    output:
      address: "global-state.global-state"
      value: 
        - "1 global-state.access-token-global-state"
      datum:
        policy_id: "<access_token_policyid>"
        alias: "<alias>"
        local_state_information:
          - nft: "<project_nft_policyid>"
            project_list: ["<project_hash_1>", "<project_hash_2>", "<project_hash_3>"]
            bool: false

          - contributor_state: "<contributor_state_policyid>"
            project_list: ["<project_hash_1>"]
            bool: false
        info: "<string>"

mints:
  - id: contributor_state
    policy: "<contributor_state_policyid>"
    redeemer:
      string: "<alias>"
    tokens:
      - "-2 project.contributor-state-token"