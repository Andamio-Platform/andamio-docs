  policy_id: "60e72e5ee056545fcb37f2d3f9b853daede356516ab5c80f886a652a"
  tokens:
    - name: "<courseId>"
      description: "Token name is the course's LocalStateNFT policy ID"

questions:
  - "What is the redeemer constructor number?"
  - "Are add/remove teachers different redeemer actions or same action with different datum?"
  - "Can governance token ever be burned (course deletion)?"
