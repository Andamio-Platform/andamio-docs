# V2 Validator: Local State NFT Validator
# Status: PLACEHOLDER - partially complete from CBOR analysis

id: "course.local-state-nft-validator"
name: "Local State NFT Validator"
system: "course"
status: "placeholder"

# From address-registry.json
address: "addr_test1xzlrs55we4u7speyteuqdnw7tl7u4npzm9p2j5l9lgfu32uey3l3jfdh9fjp5r36meser0d70vlrls0agh62ur622jmqtucd7n"
purpose: "spend"

description: |
  Holds the LocalStateNFT for course registration. The NFT's minting policy ID
  IS the courseId - this is a critical design feature. Datum contains the
  course creator's alias.

# Known from CBOR analysis
known_facts:
  - "Holds LocalStateNFT (policy ID = courseId)"
  - "Policy ID doubles as course identifier"
  - "Datum contains creator alias"
  - "Spent and recreated during teacher updates"

# Transactions that use this validator
used_in:
  - transaction: "course.admin.create"
    role: "output"
    notes: "Created when course is initialized"

  - transaction: "course.admin.teachers-update"
    role: "input+output"
    notes: "Spent with courseId redeemer, recreated unchanged"
    redeemer: "bytes (courseId)"

# Datum schema (known from CBOR)
datum_schema:
  status: "complete"
  format: "simple bytes"
  fields:
    - name: "alias"
      type: "bytes"
      description: "Course creator's alias"
      example: '"james"'

redeemers:
  status: "partial"
  known_actions:
    - data: "bytes (courseId)"
      used_in: ["teachers-update"]
      description: "Spend action for updates"

# Related components
related:
  policy: "local-state-nft-policy"
  policy_id: "varies per course - IS the courseId"
  tokens:
    - name: "LocalStateNFT"
      hex: "4c6f63616c53746174654e4654"

design_notes:
  - "CRITICAL: The LocalStateNFT policy ID IS the courseId"
  - "Each course has a unique policy for its LocalStateNFT"
  - "This creates a 1:1 mapping between policy IDs and courses"
