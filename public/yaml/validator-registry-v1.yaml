# Andamio Registry - Source of Truth for Validators and Redeemers (Protocol v1)
# This file serves as the central registry for all validators and their redeemers

systems:  
  # Global State
  global-state:
    validators:
      params-ref-validator:
        name: "Params Ref Validator"
        doc: "protocol/v1/validators/global-state/params-ref-validator"
        purpose: "spend"
        address: "<params_ref_validator_address>"
        redeemer: 
          - type: bytes
            transaction: ""

      global-state:
        name: "Global State"
        doc: "protocol/v1/validators/global-state/global-state"
        purpose: "spend"
        address: "<global_state_address>"
        redeemer:
          - type: action
            GlobalStateAction:
              - action: "StateChangeMint"
                transaction: ["contributor.mint-project-state", "student.mint-local-state"]
              - action: "StateChangeBurn"
                transaction: ["contributor.burn-project-state", "student.burn-local-state"]
              - action: "DeleteState"
                transaction: ""
              - action: "ChangeUserInfo"
                transaction: ""
              - action: "MoveState"
                transaction: ""

      init-global-state-observer:
        name: "Init Global State Observer"
        doc: "protocol/v1/validators/global-state/observers/init-global-state-observer"
        blueprint: "global.plutus"
        title: "Init_Global_State_Observer"
        purpose: "withdraw"
        redeemer: 
          - type: bytes
            transaction: ""
    # Global State Tokens
    tokens:
      access-token-user:
        asset-id: "<access_token_policyid>.222<alias>"
        minted-in: "general.access-token-mint"
        used-in:
          - "contributor.mint-project-state"
          - "contributor.burn-project-state"
          - "contributor.commit-project"
          - "contributor.unlock-project"
          - "contributor.get-rewards"
          - "contributor.add-info"
          - "course-creator.accept-assignment"
          - "course-creator.deny-assignment"
          - "course-creator.mint-module-tokens"
          - "project-creator.accept-project"
          - "project-creator.deny-project"
          - "project-creator.refuse-project"
          - "project-creator.manage-treasury-token"
          - "project-creator.mint-treasury-token"
          - "student.burn-local-state"
          - "student.commit-to-assignment"
          - "student.leave-assignment"
          - "student.mint-local-state"
          - "student.update-assignment"
        referenced-in:
        burned-in: null
      access-token-global-state:
        asset-id: "<access_token_policyid>.100<alias>"
        minted-in: "general.access-token-mint"
        used-in:
          - "contributor.mint-project-state"
          - "contributor.burn-project-state"
          - "student.burn-local-state"
          - "student.mint-local-state"
        referenced-in:
        burned-in: null
      access-token-index:
        asset-id: "<access_token_policyid>.\" \""
        minted-in: "general.access-token-mint"
        used-in: "general.access-token-mint"
        referenced-in:
        burned-in: null
  
  # Index Validators
  index-validators:
    validators:
      index-ref:
        name: "Index Ref"
        doc: "protocol/v1/validators/index-validators/index-ref"
        purpose: "spend"
        address: "<index_ref_address>"
        redeemer: {}

      index-scripts:
        name: "Index Scripts"
        doc: "protocol/v1/validators/index-validators/index-scripts"
        purpose: ["spend", "mint", "withdraw"]
        address: "<index_scripts_address>"
        policy: "<access_token_policyid>"
        redeemer: {}

      index-staking:
        name: "Index Staking"
        doc: "protocol/v1/validators/index-validators/index-staking"
        purpose: "withdraw"
        redeemer: {}

      init-index-observer:
        name: "Init Index Observer"
        doc: "protocol/v1/validators/index-validators/observers/init-index-observer"
        purpose: "withdraw"
        redeemer: 
          - type: "(alias, ())"
            transaction: "general.access-token-mint"

      init-index-policy:
        name: "Init Index Policy"
        doc: "protocol/v1/validators/index-validators/init-index-policy"
        purpose: "mint"
        policy: "<init_index_policyid>"
        redeemer: {}
    # Index Validator Tokens
    tokens:
      index-admin-token:
        asset-id: "<index_admin_policyid>.IndexAdmin"
        minted-in:
        used-in:
        referenced-in:
        burned-in:
      index-scripts-ref-token:
        asset-id: "<index_ref_policyid>.IndexScripts"
        minted-in:
        used-in:
        referenced-in: "general.access-token-mint"
        burned-in:
  
  # Instance Validators
  instance:
    validators:
      instance-governance-scripts:
        name: "Instance Governance Scripts"
        doc: "protocol/v1/validators/instance/instance-governance-scripts"
        purpose: ["spend", "withdraw"]
        address: "<instance_governance_scripts_address>"
        redeemer: {}

      instance-provider-scripts:
        name: "Instance Provider Scripts"
        doc: "protocol/v1/validators/instance/instance-provider-scripts"
        purpose: ["spend", "mint"]
        address: "<instance_provider_scripts_address>"
        policy: "<instance_provider_policyid>"
        redeemer:
          - type: "bytes"
            transaction: "admin.init-course"

      instance-scripts:
        name: "Instance Scripts"
        doc: "protocol/v1/validators/instance/instance-scripts"
        purpose: ["spend", "mint"]
        address: "<instance_scripts_address>"
        policy: "<instance_policyid>"
        redeemer:
          - type: "action"
            InstanceAction:
              - action: "InitCourse (placeholder)"
                transaction: "admin.init-course"
    # Instance Validator Tokens
    tokens:
      instance-admin-token:
        asset-id: "<instance_admin_policyid>.InstanceAdmin"
        minted-in:
        used-in:
          - "admin.init-course"
          - "admin.add-course-creators"
          - "admin.rm-course-creators"
          - "admin.init-project-step-1"
          - "admin.init-project-step-2"
          - "admin.init-single-contributor-state"
          - "admin.add-project-creators"
          - "admin.rm-project-creators"
        referenced-in:
        burned-in:
      # Course
      course-nft:
        asset-id: "<instance_provider_policyid>.CourseNFT"
        minted-in:
        used-in:
        referenced-in: "admin.init-course"
        burned-in:
      course-state-scripts:
        asset-id: "<instance_provider_policyid>.CourseStateScripts"
        minted-in:
        used-in:
        referenced-in: "admin.init-course"
        burned-in:
      module-scripts:
        asset-id: "<instance_provider_policyid>.ModuleScripts"
        minted-in:
        used-in:
        referenced-in: "admin.init-course"
        burned-in:
      assignment-validator:
        asset-id: "<instance_provider_policyid>.AssignmentValidator"
        minted-in:
        used-in:
        referenced-in: "admin.init-course"
        burned-in:
      # Project
      project-nft:
        asset-id: "<instance_provider_policyid>.ProjectNFT"
        minted-in:
        used-in:
        referenced-in:
          - "admin.init-project-step-1"
          - "admin.init-project-step-2"
        burned-in:
      treasury-token:
        asset-id: "<instance_provider_policyid>.TreasuryToken"
        minted-in:
        used-in:
        referenced-in:
          - "admin.init-project-step-1"
          - "admin.init-project-step-2"
        burned-in:
      escrow1:
        asset-id: "<instance_provider_policyid>.Escrow1"
        minted-in:
        used-in:
        referenced-in: "admin.init-project-step-1"
        burned-in:
      treasury-scripts:
        asset-id: "<instance_provider_policyid>.TreasuryScripts"
        minted-in:
        used-in:
        referenced-in: "admin.init-project-step-2"
        burned-in:
      contributor-state-scripts:
        asset-id: "<instance_provider_policyid>.ContributorStateScripts"
        minted-in:
        used-in:
        referenced-in:
          - "admin.init-project-step-2"
          - "admin.init-single-contributor-state"
        burned-in:
      

  # Course Local StateValidators
  course:
    validators:
      assignment-cbor-obs:
        name: "Assignment CBOR Observer"
        doc: "protocol/v1/validators/course/observers/assignment-cbor-obs"
        purpose: "withdraw"
        redeemer:
          - type: bytes
            transaction: "admin.init-course"

      assignment-validator:
        name: "Assignment Validator"
        doc: "protocol/v1/validators/course/assignment-validator"
        purpose: "spend"
        address: "<assignment_validator_address>"
        redeemer:
          - type: action
            AssignmentDecisionAction:
              - action: "Deny"
                transaction: "course-creator.deny-assignment"
              - action: "Accept"
                transaction: "course-creator.accept-assignment"
              - action: "StudentAction"
                transaction: "student.update-assignment"

      course-state-cbor-obs:
        name: "Course State CBOR Observer"
        doc: "protocol/v1/validators/course/observers/course-state-cbor-obs"
        purpose: "withdraw"
        redeemer:
          - type: bytes
            transaction: "admin.init-course"

      course-state-validator:
        name: "Course State Validator"
        doc: "protocol/v1/validators/course/course-state-scripts"
        purpose: "spend"
        address: "<course_state_validator_address>"
        redeemer:
          - type: action
            CourseStateAction:
              - action: "CommitAssignment"
                transaction: "student.commit-to-assignment"
              - action: "BurnCourseState"
                transaction: "admin.burn-course-state"

      course-state-policy:
        name: "Course State Policy"
        doc: "protocol/v1/validators/course/course-state-scripts"
        purpose: "mint"
        policy: "<course_state_policyid>"
        redeemer:
          - type: action
            CourseStateMintAction:
              - action: "CourseStateMint"
                transaction: "admin.init-course"
              - action: "CourseStateBurn"
                transaction: "admin.burn-course-state"

      module-cbor-obs:
        name: "Module CBOR Observer"
        doc: "protocol/v1/validators/course/observers/module-cbor-obs"
        purpose: "withdraw"
        redeemer:
          - type: bytes
            transaction: "admin.init-course"

      module-ref-validator:
        name: "Module Ref Validator"
        doc: "protocol/v1/validators/course/module-scripts"
        purpose: "spend"
        address: "<module_ref_validator_address>"
        redeemer:
          - type: action
            ModuleRefAction:
              - action: "Update"
                transaction: "course-creator.update-module-token"
              - action: "BurnModuleToken"
                transaction: "course-creator.burn-module-token"
      
      module-policy:
        name: "Module Policy"
        doc: "protocol/v1/validators/course/module-scripts"
        purpose: "mint"
        policy: "<module_policyid>"
        redeemer:
          - type: action
            ModuleTokenMintAction:
              - action: "ModuleMint"
                transaction: "course-creator.mint-module-tokens"
              - action: "ModuleBurn"
                transaction: "course-creator.burn-module-token"
    # Course Local State Tokens
    tokens:
      course-nft:
        asset-id: "<course_nft_policyid>.CourseNFT"
        minted-in: "admin.init-course"
        used-in:
          - "admin.add-course-creators"
          - "admin.rm-course-creators"
          - "course-creator.accept-assignment"
          - "course-creator.deny-assignment"
          - "course-creator.mint-module-tokens"
        referenced-in:
        burned-in:
      instance-assignment-validator:
        asset-id: "<instance_policyid>.AssignmentValidator"
        minted-in: "admin.init-course"
        used-in:
        referenced-in:
        burned-in:
      instance-module-scripts:
        asset-id: "<instance_policyid>.ModuleScripts"
        minted-in: "admin.init-course"
        used-in:
        referenced-in:
        burned-in:
      instance-course-state-scripts:
        asset-id: "<instance_policyid>.CourseStateScripts"
        minted-in: "admin.init-course"
        used-in:
        referenced-in: 
          - "student.burn-local-state"
          - "student.mint-local-state"
        burned-in:
      course-state-token:
        asset-id: "<course_state_policyid>.<alias>"
        minted-in: "student.mint-local-state"
        used-in:
          - "course-creator.accept-assignment"
          - "course-creator.deny-assignment"
          - "student.commit-to-assignment"
          - "student.leave-assignment"
          - "student.update-assignment"
        referenced-in:
        burned-in: 
          - "student.burn-local-state"
      module-token:
        asset-id: "<module_policyid>.<module_code>"
        minted-in: "course-creator.mint-module-tokens"
        used-in:
        referenced-in: "student.commit-to-assignment"
        burned-in:
  
  # Project Local State Validators
  project:
    validators:
      contributor-state-cbor-obs:
        name: "Contributor State CBOR Observer"
        doc: "protocol/v1/validators/project/observers/contributor-state-cbor-obs"
        purpose: "withdraw"
        redeemer:
          - type: bytes
            transaction: "contributor.mint-project-state"

      contributor-state-scripts:
        name: "Contributor State Scripts"
        doc: "protocol/v1/validators/project/contributor-state-scripts"
        purpose: ["spend", "mint"]
        address: "<contributor_state_scripts_address>"
        policy: "<contributor_state_policyid>"
        redeemer:
          - type: action
            ContributorStateAction:
              - action: "AddContributorInfo"
                transaction: "contributor.add-contributor-info"
              - action: "UpdateContributorInfo"
                transaction: "contributor.update-contributor-info"
              - action: "BurnContributorInfo"
                transaction: "contributor.burn-contributor-info"
              - action: "CommitProject"
                transaction: "contributor.commit-project"
              - action: "UnlockProject"
                transaction: "contributor.unlock-project"
              - action: "GetRewards"
                transaction: "contributor.get-rewards"
              - action: "BurnContributorState"
                transaction: "contributor.burn-contributor-state"

      escrow1:
        name: "Escrow1"
        doc: "protocol/v1/validators/project/escrow1"
        purpose: "spend"
        address: "<escrow1_address>"
        redeemer:
          - type: action
            ProjectAction:
              - action: "AcceptProject"
                transaction: "project-creator.accept-project"
              - action: "DenyProject"
                transaction: "project-creator.deny-project"
              - action: "RefuseProject"
                transaction: "project-creator.refuse-project"
              - action: "ManageContributor"
                transaction: "project-creator.manage-contributor"

      escrow1-cbor-obs:
        name: "Escrow1 CBOR Observer"
        doc: "protocol/v1/validators/project/observers/escrow1-cbor-obs"
        purpose: "withdraw"
        redeemer: {}


      treasury-cbor-obs:
        name: "Treasury CBOR Observer"
        doc: "protocol/v1/validators/project/observers/treasury-cbor-obs"
        purpose: "withdraw"
        redeemer: {}

      treasury-scripts:
        name: "Treasury Scripts"
        doc: "protocol/v1/validators/project/treasury-scripts"
        purpose: "spend"
        address: "<treasury_scripts_address>"
        redeemer:
          - type: action
            TreasuryAction:
              - action: "AddFunds"
                transaction: "treasury.add-funds"
              - action: "CommitProject"
                transaction: "contributor.commit-project"
              - action: "GetRewards"
                transaction: "contributor.get-rewards"
              - action: "ManageTreasury"
                transaction: "project-creator.manage-treasury-token"
      
      treasury-token:
        name: "Treasury Token"
        doc: "protocol/v1/validators/project/treasury-token"
        purpose: "mint"
        policy: "<treasury_token_policyid>"
        redeemer: {}

      treasury-token-cbor-obs:
        name: "Treasury Token CBOR Observer"
        doc: "protocol/v1/validators/project/observers/treasury-token-cbor-obs"
        purpose: "withdraw"
        redeemer: {}
    # Project Local State Tokens
    tokens:
      project-nft:
        asset-id: "<project_nft_policyid>.ProjectNFT"
        minted-in: "admin.init-project-step-1"
        used-in:
          - "admin.add-project-creators"
          - "admin.rm-project-creators"
          - "project-creator.accept-project"
          - "project-creator.deny-project"
          - "project-creator.refuse-project"
          - "project-creator.manage-treasury-token"
          - "project-creator.mint-treasury-token"
        referenced-in: "admin.init-project-step-2"
        burned-in:
      project-instance-treasury-token:
        asset-id: "<instance_policyid>.TreasuryToken"
        minted-in: "admin.init-project-step-1"
        used-in:
        referenced-in:
        burned-in:
      project-instance-escrow1:
        asset-id: "<instance_policyid>.Escrow1"
        minted-in: "admin.init-project-step-1"
        used-in:
        referenced-in: "project-creator.mint-treasury-token"
        burned-in:
      project-instance-treasury-scripts:
        asset-id: "<instance_policyid>.TreasuryScripts"
        minted-in: "admin.init-project-step-2"
        used-in:
        referenced-in: "project-creator.mint-treasury-token"
        burned-in:
      project-instance-contributor-state-scripts:
        asset-id: "<instance_policyid>.ContributorStateScripts"
        minted-in:
          - "admin.init-project-step-2"
          - "admin.init-single-contributor-state"
        used-in:
        referenced-in:
          - "contributor.mint-project-state"
          - "contributor.burn-project-state"
        burned-in:
      contributor-state-token:
        asset-id: "<contributor_state_policyid>.<alias>"
        minted-in: "contributor.mint-project-state"
        used-in:
          - "contributor.burn-project-state"
          - "contributor.commit-project"
          - "contributor.unlock-project"
          - "contributor.get-rewards"
          - "contributor.add-info"
          - "project-creator.accept-project"
          - "project-creator.deny-project"
          - "project-creator.refuse-project"
        referenced-in:
        burned-in: "contributor.burn-project-state"
      treasury-token:
        asset-id: "<treasury_token_policyid>.<escrow_hash>"
        minted-in: "project-creator.mint-treasury-token"
        used-in:
          - "contributor.commit-project"
          - "project-creator.manage-treasury-token"
        referenced-in:
        burned-in:
