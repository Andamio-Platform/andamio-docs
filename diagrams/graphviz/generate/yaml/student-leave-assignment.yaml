name: StudentLeaveAssignmentTransaction

# Metadata about this transaction type
metadata:
  role: "Student"
  category: "assignment_management"
  requires_tokens: ["localStateToken", "222at"]
  estimated_fee: "1.5 ADA"
  description: "Student leaves an assignment they previously committed to"
  multi_signature: false

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# Reference inputs (gray boxes on left)
references:
  - id: params_ref
    title: "params ref"
  
  - id: instance_ref  
    title: "instance ref"
    
  - id: global_state_ref
    title: "global state"

# Input UTxOs
inputs:
  - id: input_student_wallet
    title: "Student Wallet"
    values:
      - "222at token"
      - "3.0 ADA"

  - id: input_course_state
    title: "Course State UTxO"
    values:
      - "1 localStateToken"
    datum:
      assignments: "current_assignment_list[]"
      ls_cs: "course_state_cs"
      at_cs: "access_token_cs"
      alias: "student_alias"
    redeemer:
      id: course_state_redeemer
      title: "Leave Assignment"
      params:
        - "assignmentIndex"
        - "reason"

# Reference Input UTxOs (read-only)
reference_inputs:
  - id: input_global_data
    title: "Global Data UTxO"
    values:
      - "1 prt"
    datum:
      courseInstance: "(irt, course_instance)[]"
      coursePolicy: "(prt, course_policy)[]"

  - id: input_course_instance
    title: "CourseInstance UTxO"
    values:
      - "1 irt"
    datum:
      ls_cs: "localStateTokens[]"
      course_nft_cs: "course_nft_cs"
      modules: "module_list[]"

# Transaction
transaction:
  id: leave_assignment_operation
  title: "leave\nassignment"
    
# Output UTxOs
outputs:
  - id: output_course_state
    title: "Updated Course State"
    values:
      - "1 localStateToken"
    datum:
      assignments: "updated_assignment_list[]"
      ls_cs: "course_state_cs"
      at_cs: "access_token_cs"
      alias: "student_alias"

  - id: output_student_wallet
    title: "Student Wallet"
    values:
      - "222at token"
      - "1.5 ADA"

# Automatic connections based on structure
connections:
  # Reference connections (no arrows)
  - from: params_ref
    to: input_global_data
    attrs: {dir: "none", style: "dashed"}
  
  - from: instance_ref
    to: input_course_instance  
    attrs: {dir: "none", style: "dashed"}
    
  - from: global_state_ref
    to: input_course_state
    attrs: {dir: "none", style: "dashed"}