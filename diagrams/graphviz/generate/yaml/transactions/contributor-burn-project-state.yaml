name: ContributorBurnContributorInfoTransaction

# Metadata about this transaction type
metadata:
  role: "Contributor"
  category: "profile_management"
  requires_tokens: ["contributorInfoToken", "contributorNFT"]
  estimated_fee: "1.5 ADA"
  description: "Contributor burns their contributor info token"
  multi_signature: false

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: ["1 index.222bob"]

  - id: global_state_1
    type: script
    redeemer: 
      policy_id: "nft"
      string: ["project hash 4", "project hash 5", "project hash 6"]
      policy_id: "contributor_state"
    output:
      address: "global_state"
      value: ["1 index.100bob"]
      datum:
        policy_id: "global_state"
        alias: "bob"
        local_state_information:
          - policy_id: "nft"
            string: ["project hash 1", "project hash 2", "project hash 3"]
            bool: true
        info: "()"

  - id: contributor_state_1
    type: script
    redeemer:
      alias: "bob"
    output:
      address: "contributor_state"
      value: ["2 contributor_state.bob"]
      datum: 
        string: ["project hash 1", "project hash 2", "project hash 3"]

# reference inputs
reference-inputs:
  - id: instance_1
    type: script
    output:
      address: "instance"
      value: ["1 instance_provider.ContributorStateScripts"]
      datum: "nft"
      script: "contributor_state"

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: ["1 index.222bob"]

  - id: global_state_1
    type: script
    output:
      address: "global_state"
      value: ["1 index.100bob"]
      datum:
        policy_id: "global_state"
        alias: "bob"
        local_state_information:
          - policy_id: "nft"
            string: ["project hash 1", "project hash 2", "project hash 3", "project hash 4", "project hash 5", "project hash 6"]
            bool: false
        info: "()"

mints:
  - id: contributor_state
    redeemer:
      string: "bob"
    tokens: ["-2 contributor_state.bob"]