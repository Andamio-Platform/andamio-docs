name: AdminInitCourseTransaction

# Metadata about this transaction type
metadata:
  role: "InstanceAdmin"
  category: "course_management"
  requires_tokens: ["instanceAdminNFT"]
  estimated_fee: "4.0 ADA"
  description: "Instance admin initializes a new course in the platform"
  multi_signature: true
  required_signatures: ["instanceAdmin", "globalAdmin"]

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: instance_admin
    type: wallet
    output:
      address: "instance admin wallet"
      value: ["1 nft.InstanceAdmin"]

# reference inputs
reference_inputs:
  - id: instance_provider_1
    type: script
    output:
      address: "instance_provider"
      value: ["1 instance_provider.CourseNFT"]
      datum: ["nft_logic1", "nft_logic2", "nft_logic3"]

  - id: instance_provider_2
    type: script
    output:
      address: "instance_provider"
      value: ["1 instance_provider.AssignmentValidator"]
      datum: ["assignment_logic1", "assignment_logic2"]
      script: "assignment_obs"

  - id: instance_provider_3
    type: script
    output:
      address: "instance_provider"
      value: ["1 instance_provider.ModuleScripts"]
      datum: ["module_logic1", "module_logic2"]
      script: "module_obs"

  - id: instance_provider_4
    type: script
    output:
      address: "instance_provider"
      value: ["1 instance_provider.CourseStateScripts"]
      datum: ["course_state_logic1", "course_state_logic2", "course_state_logic3"]
      script: "course_state_obs"

# outputs
outputs:
  - id: instance_governance_1
    type: script
    output:
      address: "instance governance"
      value: ["1 nft.CourseNFT"]
      datum:
        creators: ["bob", "carol"]
        policy_id: "nft"

  - id: instance_1
    type: script
    output:
      address: "instance"
      value: ["1 instance_provider.AssignmentValidator"]
      datum: "nft"
      script: "assignment_logic1 + nft + assignment_logic2"

  - id: instance_2
    type: script
    output:
      address: "instance"
      value: ["1 instance_provider.ModuleScripts"]
      datum: "nft"
      script: "module_logic1 + nft + module_logic2"

  - id: instance_3
    type: script
    output:
      address: "instance"
      value: ["1 instance_provider.CourseStateScripts"]
      datum: "nft"
      script: "course_state_logic1 + nft + course_state_logic2 + moudle_policy_id + course_state_logic3"



# minting
mints:
  - id: nft
    redeemer: "()"
    tokens: ['1 nft.CourseNFT']
  
  - id: instance
    redeemer:
      - policy_id: "nft"
        params: ["nft"]
        token_name: "AssignmentValidator"
      - policy_id: "nft"
        params: ["nft"]
        token_name: "ModuleScripts"
      - policy_id: "nft"
        params: ["nft", "module_policy_id"]
        token_name: "CourseStateScripts"
    tokens: ["1 instance_provider.AssignmentValidator",
             "1 instance_provider.ModuleScripts",
             "1 instance_provider.CourseStateScripts"]

# withdrawing
withdraws:
  - id: assignment_obs
    redeemer:
      string: "tx_id"
      string: "tx_ix"
    amount: 0

  - id: module_obs
    redeemer:
      string: "tx_id"
      string: "tx_ix"
    amount: 0

  - id: course_state_obs
    redeemer:
      string: "tx_id"
      string: "tx_ix"
    amount: 0