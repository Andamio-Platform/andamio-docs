name: AdminInitProjectStep2Transaction

# Metadata about this transaction type
metadata:
  role: "InstanceAdmin"
  category: "instance_management"
  requires_tokens: ["instanceAdminNFT"]
  estimated_fee: "4.0 ADA"
  description: "Instance admin completes project initialization (step 2 of 2)"
  multi_signature: true
  required_signatures: ["instanceAdmin", "globalAdmin"]

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# inputs
inputs:
  - id: instance_admin
    type: wallet
    output:
      address: "instance admin wallet"
      value: ["1 nft.InstanceAdmin"]

# reference inputs
reference_inputs:
  - id: instance_provider_1
    type: script
    output:
      address: "instance_provider"
      value: ["1 instance_provider.ProjectNFT"]
      datum: ["nft_logic1", "nft_logic2", "nft_logic3"]

  - id: instance_provider_2
    type: script
    output:
      address: "instance_provider"
      value: ["1 instance_provider.TreasuryToken"]
      datum: ["treasury_token_logic1", "treasury_token_logic2"]
      script: "treasury_token_obs"

  - id: instance_provider_3
    type: script
    output:
      address: "instance_provider"
      value: ["1 instance_provider.TreasuryScripts"]
      datum: ["treasury_scripts_logic1", "treasury_scripts_logic2", "treasury_scripts_logic3"]
      script: "treasury_scripts_obs"

  - id: instance_provider_4
    type: script
    output:
      address: "instance_provider"
      value: ["1 instance_provider.ContributorStateScripts"]
      datum: ["course_state_logic1", "course_state_logic2", "course_state_logic3"]
      script: "contributor_state_obs"

  - id: instance_governance_1
    type: script
    output:
      address: "instance governance"
      value: ["1 nft.ProjectNFT"]
      datum:
        creators: ["bob", "carol"]
        policy_id: "nft"

# outputs
outputs:

  - id: instance_1
    type: script
    output:
      address: "instance"
      value: ["1 instance_provider.TreasuryScripts"]
      datum: "nft"
      script: "treasury_scripts_logic1 + nft + treasury_scripts_logic2 + treasury_token_policy_id + treasury_scripts_logic3"

  - id: instance_2
    type: script
    output:
      address: "instance"
      value: ["1 instance_provider.ContributorStateScripts"]
      datum: "nft"
      script: "course_state_logic1 + nft + course_state_logic2 + [(instance_nft, [102, 103])] + course_state_logic3"

# minting
mints:
  - id: instance
    redeemer:
      - policy_id: "nft"
        params: ["nft", "treasury_token_policy_id"]
        token_name: "TreasuryScripts"
      - policy_id: "nft"
        params: ["nft", "[(instane_nft, [ls_data])]"]
        token_name: "ContributorStateScripts"
    tokens: ["1 instance_provider.TreasuryScripts",
             "1 instance_provider.ContributorStateScripts"]

# withdrawing
withdraws:
  - id: treasury_scripts_obs
    redeemer:
      string: "tx_id"
      string: "tx_ix"
    amount: 0

  - id: contributor_state_obs
    redeemer:
      string: "tx_id"
      string: "tx_ix"
    amount: 0