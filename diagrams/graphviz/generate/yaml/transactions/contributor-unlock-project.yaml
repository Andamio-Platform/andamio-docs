name: ContributorUnlockProjectTransaction

# Metadata about this transaction type
metadata:
  role: "Contributor"
  category: "project_management"
  requires_tokens: ["100at", "contributorNFT", "projectStateToken"]
  estimated_fee: "2.0 ADA"
  description: "Contributor unlocks and leaves a project"
  multi_signature: false

# inputs
inputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: ["1 index.222bob"]
  
  - id:
    type: script
    redeemer: 
      alias: "bob"
      maybe_string: "Nothing"
    output:
      address: "escrow"
      value: ["1 contributor_state.bob",
              "12000000 lovelace"]
      datum:
        project_data:
          project_data: "content hash"
          deadline: 16062025
          lovelace_am: 10000000
          flatten_value: []
        script_hash: "treasury"
        policy_id: "contributor_state"
        maybe_string: "Nothing"

# outputs
outputs:
  - id: user_1
    type: wallet
    output:
      address: "user"
      value: ["1 index.222bob"]

  - id: contributor_state_1
    type: script
    output:
      address: "contributor_state"
      value: ["2000000 lovelace + 1 contributor_state.bob"]
      datum: 
        string: ""

  - id: treasury_2
    type: script
    output:
      address: "treasury"
      value: ["10000000"]