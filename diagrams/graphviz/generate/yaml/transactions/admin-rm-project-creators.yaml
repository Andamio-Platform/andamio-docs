name: AdminRmProjectCreatorsTransaction

# Metadata about this transaction type
metadata:
  role: "InstanceAdmin"
  category: "access_management"
  requires_tokens: ["instanceAdminNFT"]
  estimated_fee: "3.0 ADA"
  description: "Instance admin removes project creators from the platform"
  multi_signature: true
  required_signatures: ["instanceAdmin", "globalAdmin"]

graph_attrs:
  rankdir: LR
  bgcolor: "#ffffff"
  splines: ortho
  nodesep: 0.4
  ranksep: 0.8

# Reference inputs (gray boxes on left)
references:
  - id: params_ref
    title: "params ref"
  
  - id: instance_ref  
    title: "instance ref"
    
  - id: global_state_ref
    title: "global state"

# Input UTxOs
inputs:
  - id: input_admin_wallet
    title: "Admin Wallet"
    address: "string"
    values:
      - "ada balance"

  - id: input_project_creators
    title: "Project Creators UTxO"
    address: "global_state"
    values:
      - "project creator tokens"
    datum:
      creator_list: "list"
      permissions: "active"
    redeemer:
      id: project_creators_redeemer
      title: "GlobalStateAction.UpdateGlobalInfo"
      params:
        - "creator_addresses"

# Reference Input UTxOs (read-only, at bottom of input column)
reference_inputs:
  - id: input_global_data
    title: "Global Data UTxO"
    address: "string"
    values:
      - "1 reference token"
    datum:
      admin_config: "configuration data"
      creator_settings: "settings"

# Transaction
transaction:
  id: main_operation
  title: "remove project creators\nadmin operation"
    
# Output UTxOs
outputs:
  - id: output_project_creators
    title: "Updated Project Creators"
    address: "global_state"
    values:
      - "project creator tokens"
    datum:
      creator_list: "updated_list"
      permissions: "active"

  - id: output_admin_wallet
    title: "Admin Wallet"
    address: "string"
    values:
      - "remaining ada"

# Explicit connections for complex flow
connections:
  # Reference connections (no arrows)
  - from: params_ref
    to: input_global_data
    attrs: {dir: "none", style: "dashed"}
  
  - from: instance_ref
    to: input_project_creators  
    attrs: {dir: "none", style: "dashed"}
    
  - from: global_state_ref
    to: input_project_creators
    attrs: {dir: "none", style: "dashed"}